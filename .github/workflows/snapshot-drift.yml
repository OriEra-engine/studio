# engine-snapshot 漂移监视（studio#3 · B 腿）：每周一 02:00 UTC 对比引擎 main，
# 漂移则自动开/更新 issue。同步动作永远人工发起（跑 scripts/sync-engine-snapshot.mjs）。
name: snapshot-drift

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OriEra-engine/engine
          path: engine-ref
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compare snapshot against engine main
        run: |
          node scripts/sync-engine-snapshot.mjs --engine "$GITHUB_WORKSPACE/engine-ref" --check > drift.txt 2>&1 && {
            echo "clean"
            exit 0
          }
          cat drift.txt
          exit 1
      - name: Open or update drift issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🔄 engine-snapshot 落后于引擎 main — 运行 scripts/sync-engine-snapshot.mjs"
          EXISTING=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" --jq '.[] | select(.title=="'"$TITLE"'") | .number' | head -1)
          BODY=$(printf '%s\n\n<details><summary>漂移清单</summary>\n\n```\n%s\n```\n</details>' "自动监视发现 engine-snapshot 与 [引擎 main](https://github.com/OriEra-engine/engine/commits/main) 漂移。同步方法：本地跑 \`node scripts/sync-engine-snapshot.mjs --engine <引擎仓路径>\` 后提交。" "$(cat drift.txt)")
          if [ -n "$EXISTING" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/$EXISTING/comments" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues" -f title="$TITLE" -f body="$BODY" >/dev/null
          fi
