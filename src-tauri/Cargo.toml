[package]
name = "oriera-studio"
version = "0.7.4"
description = "OriEra Studio — 开箱即用的 OriEra 世界引擎桌面工作台"
edition = "2021"

[lib]
name = "oriera_studio_lib"
# 桌面端只需 staticlib+rlib；cdylib 仅移动端需要（且 windows-gnu 下会触发
# binutils ld "export ordinal too large" 限制）
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.6", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
# 注意：windows-gnu 下 strip=true 会导致 api-ms-win-crt 解析失败（启动即崩），勿开
strip = false
