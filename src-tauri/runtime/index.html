<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>__PROJECT_NAME__ · OriEra 原型</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #0d1017; color: #e6e8ef;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  #app { display: flex; height: 100%; }
  #scene { flex: 1; position: relative; min-width: 0; }
  #scene canvas { display: block; }
  #hud { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; gap: 10px;
    align-items: center; pointer-events: none; }
  .chip { background: rgba(13,16,23,.82); border: 1px solid #2a3a5c; border-radius: 20px;
    padding: 6px 14px; font-size: 12px; color: #aeb6cc; pointer-events: auto; }
  #dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #556; margin-right: 6px; }
  #dot.live { background: #35d07f; box-shadow: 0 0 8px #35d07f; }
  #panel { width: 400px; background: #12151f; border-left: 1px solid #232a3d; display: flex; flex-direction: column; }
  #tabs { display: flex; border-bottom: 1px solid #232a3d; }
  #tabs button { flex: 1; background: none; border: none; color: #7c86a3; padding: 12px 4px;
    font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
  #tabs button.on { color: #7eb8ff; border-bottom-color: #7eb8ff; }
  .tab-page { flex: 1; overflow-y: auto; padding: 14px; display: none; }
  .tab-page.on { display: block; }
  #chat-log { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .msg { max-width: 92%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.65; white-space: pre-wrap; }
  .msg.npc { background: #1b2336; border: 1px solid #2c3c5e; align-self: flex-start; }
  .msg.me { background: #1d3a5f; align-self: flex-end; }
  .msg.sys { color: #7c86a3; font-size: 12px; align-self: center; }
  .msg b { color: #9fc3ff; }
  #chat-input { display: flex; gap: 8px; }
  #chat-input input { flex: 1; background: #0d1017; border: 1px solid #2a3a5c; color: #e6e8ef;
    border-radius: 8px; padding: 10px 12px; font-size: 13px; outline: none; }
  #chat-input button { background: #2d5b9e; border: none; color: #fff; border-radius: 8px;
    padding: 0 18px; cursor: pointer; font-size: 13px; }
  #chat-input button:disabled { background: #2a3348; cursor: default; }
  .beat { border-left: 3px solid #2a3a5c; padding: 8px 12px; margin-bottom: 10px; border-radius: 0 8px 8px 0;
    background: #161a28; }
  .beat.now { border-left-color: #7eb8ff; background: #1a2440; }
  .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .choice { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%;
    background: #1a2440; color: #cdd6ec; border: 1px solid #2d5b9e; border-radius: 10px;
    padding: 10px 14px; cursor: pointer; font-size: 13px; text-align: left; }
  .choice:hover { background: #223055; }
  .choice i { color: #8fa3c8; font-style: normal; font-size: 11px; flex: none; }
  .choice.off { opacity: .4; cursor: not-allowed; }
  .loop-auto { font-size: 10px; color: #6fd3a0; border: 1px solid #2d6a4a; border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
  .beat.done { opacity: .45; }
  .beat .ph { font-size: 11px; color: #7c86a3; }
  .beat .tt { font-size: 13.5px; font-weight: 700; margin: 2px 0; }
  .beat .ds { font-size: 12.5px; color: #aeb6cc; line-height: 1.6; }
  #btn-next { width: 100%; margin: 6px 0 14px; padding: 11px; background: #2d5b9e; color: #fff;
    border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #btn-next:disabled { background: #2a3348; }
  .codex h4 { margin: 14px 0 8px; font-size: 13px; color: #9fc3ff; }
  .codex h4:first-child { margin-top: 0; }
  .loop-step { display: flex; gap: 8px; align-items: center; padding: 7px 10px; background: #161a28;
    border-radius: 8px; margin-bottom: 6px; font-size: 13px; cursor: pointer; }
  .loop-step.done { color: #5f6b8a; text-decoration: line-through; }
  .mech { background: #161a28; border-radius: 8px; padding: 9px 12px; margin-bottom: 6px; }
  .mech b { font-size: 13px; color: #cdd6ec; }
  .mech div { font-size: 12px; color: #8a93ad; margin-top: 2px; line-height: 1.55; }
  table.eco { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.eco th { text-align: left; color: #7c86a3; padding: 4px 6px; font-weight: 500; }
  table.eco td { padding: 5px 6px; border-top: 1px solid #1e2536; color: #b6bfd6; }
  #npc-list .npc-row { display: flex; gap: 10px; padding: 10px; background: #161a28; border-radius: 10px;
    margin-bottom: 8px; cursor: pointer; align-items: center; }
  #npc-list .npc-row:hover, #npc-list .npc-row.sel { background: #1a2440; }
  .npc-ava { width: 38px; height: 38px; border-radius: 10px; flex: none; }
  .npc-nm { font-size: 13.5px; font-weight: 700; }
  .npc-rl { font-size: 11px; color: #7c86a3; }
  .npc-pf { font-size: 11.5px; color: #8a93ad; margin-top: 3px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #fallback { position: fixed; inset: 0; background: #0d1017ee; display: none; align-items: center;
    justify-content: center; z-index: 99; text-align: center; padding: 40px; line-height: 2; }
  /* v0.7.5：加载指示——白屏与崩溃从此可区分（评审：玩家第一步就摔死） */
  #boot { position: fixed; inset: 0; background: #0d1017; display: flex; align-items: center;
    justify-content: center; z-index: 98; transition: opacity .45s; }
  #boot.hide { opacity: 0; pointer-events: none; }
  .boot-ring { width: 34px; height: 34px; border: 3px solid #1e2a44; border-top-color: #7eb8ff;
    border-radius: 50%; margin: 0 auto 14px; animation: bootspin .9s linear infinite; }
  @keyframes bootspin { to { transform: rotate(360deg); } }
  #boot-txt { color: #8a93ad; font-size: 13px; text-align: center; line-height: 2; }
  /* v0.7.5：分享场景的 AI 解锁横幅（key 只进收件人自己的浏览器） */
  #keygate { position: fixed; inset: 0; background: #0d1017f2; display: none; align-items: center;
    justify-content: center; z-index: 97; }
  .kg-box { width: min(430px, 92vw); background: #12151f; border: 1px solid #2a3a5c; border-radius: 14px;
    padding: 26px 28px; line-height: 1.7; }
  .kg-box h3 { margin-bottom: 6px; }
  .kg-box p { font-size: 12.5px; color: #8a93ad; margin-bottom: 12px; }
  .kg-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .kg-row select, .kg-row input { flex: 1; background: #0d1017; border: 1px solid #2a3a5c; color: #e6e8ef;
    border-radius: 8px; padding: 9px 11px; font-size: 13px; outline: none; }
  .kg-btns { display: flex; gap: 10px; margin-top: 12px; }
  .kg-btns button { flex: 1; border: none; border-radius: 8px; padding: 10px; cursor: pointer; font-size: 13px; }
  #kg-unlock { background: #2d5b9e; color: #fff; }
  #kg-skip { background: #161a28; color: #aeb6cc; border: 1px solid #2a3a5c; }
  #kg-msg { color: #ff9a8a; font-size: 12px; min-height: 18px; }
  .hint { font-size: 12px; color: #7c86a3; margin-top: 8px; }
  .thinking { color: #7c86a3; font-size: 12px; align-self: flex-start; }
  /* ---- #120 影游可执行腿：choice 倒计时 / video 舞台 / ending 结算 ---- */
  /* video 舞台淡出 3D 场景：runtime 只对含 video 字段的拍挂 .dimmed，其余包不受影响 */
  #scene { transition: opacity .6s; }
  #scene.dimmed { opacity: 0; }
  /* choice 倒计时条：bar 以 scaleX 从满到空（动画时长由 JS 按 countdown 写入） */
  #choice-timer { position: relative; height: 8px; background: #1e2536; border-radius: 4px;
    overflow: hidden; margin: 14px 0 4px; }
  #choice-timer-bar { position: absolute; inset: 0; background: linear-gradient(90deg, #7eb8ff, #35d07f);
    border-radius: 4px; transform-origin: left; }
  @keyframes cdshrink { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  #choice-timer-txt { font-size: 11px; color: #ffd88a; margin: 4px 0 8px; min-height: 14px; }
  /* video 舞台：全屏正片（z-index 低于 keygate 97 / boot 98 / fallback 99，出错页仍可覆盖） */
  #video-stage { position: fixed; inset: 0; background: #000; z-index: 96; display: none;
    align-items: center; justify-content: center; }
  #video-el { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #video-skip { position: absolute; right: 18px; bottom: 16px; background: rgba(13,16,23,.72);
    color: #aeb6cc; border: 1px solid #2a3a5c; border-radius: 20px; padding: 8px 18px;
    cursor: pointer; font-size: 13px; }
  #video-skip:hover { color: #fff; }
  /* ending 结算覆盖层：结局标题 + 一句评语 + 变量小结 + 重开 */
  #ending { position: fixed; inset: 0; z-index: 95; display: none; align-items: center;
    justify-content: center; background: radial-gradient(ellipse at center, #16213a 0%, #0d1017 72%); }
  .ending-box { text-align: center; max-width: 540px; padding: 40px 30px; }
  #ending-kicker { font-size: 12px; letter-spacing: 6px; color: #7c86a3; margin-bottom: 10px; }
  #ending-title { font-size: 30px; margin: 0 0 14px; color: #e8d78a; }
  #ending-line { font-size: 14px; color: #aeb6cc; line-height: 1.9; }
  #ending-vars { margin: 18px 0 26px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #btn-restart { background: #2d5b9e; color: #fff; border: none; border-radius: 8px;
    padding: 12px 36px; cursor: pointer; font-size: 14px; }
  #btn-restart:hover { background: #3a6fb8; }
</style>
</head>
<body>
<div id="app">
  <div id="scene">
    <div id="hud">
      <div class="chip"><b style="color:#9fc3ff">__PROJECT_NAME__</b> · <span id="tagline"></span></div>
      <div class="chip">第 <b id="day" style="color:#e8d78a">1</b> 天</div>
      <span id="res-chips" style="display:flex;gap:6px;flex-wrap:wrap"></span>
      <div class="chip" id="ai-chip" style="display:none"></div>
      <div class="chip"><span id="dot"></span><span id="prov-name">规则引擎（离线）</span></div>
    </div>
  </div>
  <div id="panel">
    <div id="tabs">
      <button class="on" data-t="chat">💬 对话</button>
      <button data-t="story">📖 剧情</button>
      <button data-t="codex">🎯 玩法</button>
      <button data-t="npcs">🤖 居民</button>
    </div>
    <div id="page-chat" class="tab-page on">
      <div id="chat-log"></div>
      <div id="chat-input">
        <input id="say" placeholder="对 TA 说点什么…" />
        <button id="buy-hint" style="display:none; background:#7a5b1e" title="花 10 金币向 TA 买一条剧情线索">💡10</button>
        <button id="send">发送</button>
      </div>
      <p class="hint">NPC 由 AI 驱动 · 记忆保存在本浏览器 · F5 刷新</p>
    </div>
    <div id="page-story" class="tab-page"></div>
    <div id="page-codex" class="tab-page codex"></div>
    <div id="page-npcs" class="tab-page"></div>
  </div>
</div>
<div id="fallback">
  <div>
    <div style="font-size:40px">🌌</div>
    <h2 style="margin:12px 0">请通过 OriEra Studio 打开本项目</h2>
    <p style="color:#8a93ad">生成的游戏原型依赖 Studio 内置的引擎服务与静态服务器。</p>
  </div>
</div>
<!-- v0.7.5：加载指示（z-index 低于 fallback，出错时被人话错误页覆盖） -->
<div id="boot">
  <div>
    <div class="boot-ring"></div>
    <div id="boot-txt">正在进入世界…<br><span style="font-size:11px;color:#5f6b8a">首次加载会下载 3D 模型，请稍候</span></div>
  </div>
</div>
<!-- v0.7.5：分享件解锁横幅——收到的单文件默认离线预览，粘贴 Key 解锁真 AI -->
<div id="keygate">
  <div class="kg-box">
    <h3>🔓 解锁这个世界的 AI</h3>
    <p>你正在玩一份 OriEra 世界分享件。当前 NPC 由离线性格引擎驱动（有限预览）；粘贴一个
    AI Key，NPC 将由大模型真实驱动。Key 只保存在你自己的浏览器，不会发给任何人。</p>
    <div class="kg-row">
      <select id="kg-kind">
        <option value="zhipu">智谱 · glm-4-flash（有免费额度）</option>
        <option value="deepseek">DeepSeek</option>
        <option value="openai-compat">OpenAI 兼容端点（自填）</option>
      </select>
    </div>
    <div class="kg-row"><input id="kg-key" type="password" placeholder="粘贴 API Key（sk-… / 智谱 …）" /></div>
    <div class="kg-row" id="kg-extra" style="display:none">
      <input id="kg-base" placeholder="Base URL（如 https://api.x.com/v1）" />
      <input id="kg-model" placeholder="模型名" style="max-width:130px" />
    </div>
    <div id="kg-msg"></div>
    <div class="kg-btns">
      <button id="kg-unlock">解锁 AI</button>
      <button id="kg-skip">先离线逛逛</button>
    </div>
  </div>
</div>
<!-- #120 影游可执行腿：video 舞台——beats 节点含 video 字段时全屏播正片，
     播完/跳过/加载失败自动回场景出选项；无 video 字段的模板永不显示此层 -->
<div id="video-stage">
  <video id="video-el" playsinline></video>
  <button id="video-skip">跳过镜头 ▶</button>
</div>
<!-- #120 影游可执行腿：ending 节点按 settle 规则结算后的全屏结局画面 -->
<div id="ending">
  <div class="ending-box">
    <div id="ending-kicker">— 结 局 达 成 —</div>
    <h2 id="ending-title"></h2>
    <p id="ending-line"></p>
    <div id="ending-vars"></div>
    <button id="btn-restart">重新体验</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "/examples/11-ai-cafe/vendor/three.module.js",
  "oriera-vendor/OrbitControls.js": "/examples/11-ai-cafe/vendor/OrbitControls.js",
  "oriera-vendor/GLTFLoader.js": "/examples/11-ai-cafe/vendor/GLTFLoader.js",
  "oriera-vendor/utils/BufferGeometryUtils.js": "/examples/11-ai-cafe/utils/BufferGeometryUtils.js",
  "oriera-kernel": "/examples/11-ai-cafe/engine/kernel.js"
} }
</script>
<script type="module">
/* ============ 游戏数据（由 OriEra Studio 生成时注入） ============ */
const GAME = __GAME_JSON__;
const STORY = __STORY_JSON__;
const AGENTS = __AGENTS_JSON__;
/* bare specifier 走 importmap：Studio 模式指向内置快照，
   单文件导出时由导出器把映射值换成 data URL，双击即玩。 */
const KERNEL = "oriera-kernel";
/* GLB 由 GLTFLoader 的 fetch 加载——fetch 不走 importmap，必须给真实 URL；
   单文件导出时由导出器把这个字面量换成 data URL。 */
const GLB_URL = "/examples/11-ai-cafe/vendor/RobotExpressive.glb";

/* ============ L7 provider 装配（与引擎 café demo 同一机制） ============ */
let provider = null, providerReady = false;
// v0.9 槽位路由：对话/导演各走各的槽位 provider（oriera.routing.v1；
// 缺省/无凭据时 resolveSlotProvider 诚实回退全局，这里再兜底 provider）
let slotDialog = null, slotDirector = null;
/* 配置来源：优先同源 /__provider.json（Studio 植入的当前模型，改配置免刷新窗口），
   拉不到（单文件导出/file:// 直开）回退 localStorage 存档。
   studioOnline 区分两种「无 AI」：Studio 在线（去模型中心配）vs 分享件离线（弹解锁横幅）。 */
let studioOnline = false;
function setBoot(txt) { const el = document.getElementById("boot-txt"); if (el) el.innerHTML = txt + "<br><span style='font-size:11px;color:#5f6b8a'>首次加载会下载 3D 模型，请稍候</span>"; }
function hideBoot() { const el = document.getElementById("boot"); if (el) { el.classList.add("hide"); setTimeout(() => el.remove(), 600); } }
async function loadProviderCfg() {
  try {
    const r = await fetch("/__provider.json", { cache: "no-store" });
    if (r.ok) {
      studioOnline = true;
      const cfg = await r.json();
      if (cfg && cfg.key && cfg.kind && cfg.kind !== "rule") {
        try { localStorage.setItem("aicafe.llm.v1", JSON.stringify(cfg)); } catch (e) {}
        return cfg;
      }
    }
  } catch (e) { /* 无服务器环境：分享件/file:// 场景 */ }
  try { return JSON.parse(localStorage.getItem("aicafe.llm.v1") || "null"); } catch (e) { return null; }
}
/* v0.7.5：分享件的 AI 解锁横幅（key 只写收件人自己的 localStorage，与 demo 11 同约定） */
function setupKeygate() {
  const kg = document.getElementById("keygate");
  const kind = document.getElementById("kg-kind");
  const keyInput = document.getElementById("kg-key");
  const extra = document.getElementById("kg-extra");
  const msg = document.getElementById("kg-msg");
  kind.onchange = () => {
    extra.style.display = kind.value === "openai-compat" ? "flex" : "none";
    msg.textContent = "";
  };
  document.getElementById("kg-unlock").onclick = () => {
    const k = kind.value, key = keyInput.value.trim();
    if (!key) { msg.textContent = "先粘贴 API Key（智谱 / DeepSeek 控制台可免费申请）"; return; }
    let cfg;
    if (k === "zhipu") cfg = { kind: "zhipu", key, model: "glm-4-flash", base: "https://open.bigmodel.cn/api/paas/v4" };
    else if (k === "deepseek") cfg = { kind: "deepseek", key, model: "deepseek-chat", base: "https://api.deepseek.com" };
    else {
      const base = document.getElementById("kg-base").value.trim();
      const model = document.getElementById("kg-model").value.trim() || "gpt-4o-mini";
      if (!base) { msg.textContent = "自建端点需要填 Base URL"; return; }
      cfg = { kind: "openai-compat", key, model, base };
    }
    try { localStorage.setItem("aicafe.llm.v1", JSON.stringify(cfg)); } catch (e) { msg.textContent = "浏览器存储不可用"; return; }
    location.reload();
  };
  document.getElementById("kg-skip").onclick = () => {
    try { sessionStorage.setItem("oriera.keygate.dismissed", "1"); } catch (e) {}
    kg.style.display = "none";
  };
  kg.style.display = "flex";
}
async function boot() {
  // 刷新键（原由 Studio initialization_script 注入——新版 WebView2 下会吞初始导航，故内建）
  document.addEventListener("keydown", e => {
    if (e.key === "F5" || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "r")) {
      e.preventDefault(); location.reload();
    }
  });
  setBoot("正在加载引擎内核…");
  let mod;
  try {
    mod = await import(KERNEL);
  } catch (e) {
    hideBoot();
    document.getElementById("fallback").style.display = "flex";
    return;
  }
  setBoot("正在装配 AI 与场景…");
  const savedCfg = await loadProviderCfg();
  if (savedCfg && savedCfg.key && savedCfg.kind !== "rule") {
    provider = mod.createProvider(savedCfg);
    providerReady = !!(provider && provider.ready);
  }
  slotDialog = (savedCfg && mod.resolveSlotProvider("npc_dialog", savedCfg)) || provider;
  slotDirector = (savedCfg && mod.resolveSlotProvider("director", savedCfg)) || provider;
  // 分享件且无可用 AI（且本次会话没跳过）→ 解锁横幅；Studio 在线环境走模型中心，不打扰
  let dismissed = false;
  try { dismissed = sessionStorage.getItem("oriera.keygate.dismissed") === "1"; } catch (e) {}
  if (!studioOnline && !providerReady && !dismissed) setupKeygate();
  if (providerReady) {
    // v0.7.4 槽位路由：状态行如实展示各槽实际模型（与全局不同才标）
    const slotTag =
      (slotDialog && slotDialog.cfg && slotDialog.cfg.model !== (savedCfg.model || "") ? " 对话:" + slotDialog.cfg.model : "") +
      (slotDirector && slotDirector.cfg && slotDirector.cfg.model !== (savedCfg.model || "") ? " 导演:" + slotDirector.cfg.model : "");
    document.getElementById("prov-name").textContent =
      (savedCfg.model || "llm") + slotTag + "（引擎 L7 · AI 已植入）";
    document.getElementById("dot").classList.add("live");
  }
  try {
    await startScene(mod);
  } catch (e) {
    hideBoot();
    const fb = document.getElementById("fallback");
    fb.innerHTML = `<div><div style="font-size:40px">🌌</div><h2 style="margin:12px 0">场景启动失败</h2><p style="color:#8a93ad">${String(e && e.message || e)}</p></div>`;
    fb.style.display = "flex";
  }
}

/* ============ 场景 ============ */
async function startScene(mod) {
  const THREE = await import("three");
  const { OrbitControls } = await import("oriera-vendor/OrbitControls.js");
  const { GLTFLoader } = await import("oriera-vendor/GLTFLoader.js");
  const mem = new mod.MemoryStore("game." + GAME.id + ".mem.v1");

  /* ---- 主题（v0.2）：space / cafe / dungeon / snow ---- */
  const THEMES = {
    space:   { bg: 0x0d1017, ground: 0x1a2438, ring: 0x2d5b9e, hemiSky: 0x8fb5ff, hemiGnd: 0x22283a, sun: 0xffe9c4 },
    cafe:    { bg: 0x1a1410, ground: 0x3a2c1e, ring: 0xc98d4e, hemiSky: 0xffd9a0, hemiGnd: 0x2a2018, sun: 0xffc37e },
    dungeon: { bg: 0x0a0d12, ground: 0x161c26, ring: 0x8a5a2e, hemiSky: 0x5a6b8e, hemiGnd: 0x0e1116, sun: 0xff9a4d },
    snow:    { bg: 0xd8e2ee, ground: 0xeef3f9, ring: 0x7ea8d8, hemiSky: 0xffffff, hemiGnd: 0xb8c8dd, sun: 0xfff4e0 },
  };
  const TH = THEMES[GAME.theme] || THEMES.space;

  const sceneEl = document.getElementById("scene");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(sceneEl.clientWidth, sceneEl.clientHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  sceneEl.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(TH.bg);
  scene.fog = new THREE.Fog(TH.bg, 18, 55);
  const camera = new THREE.PerspectiveCamera(50, sceneEl.clientWidth / sceneEl.clientHeight, 0.1, 200);
  camera.position.set(0, 6, 14);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.2, 0);
  controls.enableDamping = true; controls.maxPolarAngle = Math.PI / 2.05;
  controls.minDistance = 6; controls.maxDistance = 30;

  scene.add(new THREE.HemisphereLight(TH.hemiSky, TH.hemiGnd, 1.1));
  const sun = new THREE.DirectionalLight(TH.sun, 1.6);
  sun.position.set(6, 10, 4); scene.add(sun);
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(16, 48).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: TH.ground, roughness: .95 }));
  scene.add(ground);
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(15.4, 16, 64).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: TH.ring, transparent: true, opacity: .5 }));
  scene.add(ring);

  /* ---- 场景差异化（按玩法包种子确定性生成）----
     同一套主题下，不同玩法包的地貌道具、布光偏移、NPC 游走节奏都不同——
     「赛车」和「农场」进游戏不再是同一张素圈地图。 */
  const SCENE = (() => {
    let seed = 2166136261;
    for (const c of (GAME.gameplay_id || GAME.id || "oriera")) {
      seed ^= c.codePointAt(0);
      seed = Math.imul(seed, 16777619);
    }
    let st = seed >>> 0;
    const rng = () => ((st = (st * 1664525 + 1013904223) >>> 0) / 4294967296);
    const kinds = ["crate", "pillar", "lamp", "table"];
    const props = [];
    const n = 7 + Math.floor(rng() * 8);
    for (let k = 0; k < n; k++) {
      const ang = rng() * Math.PI * 2;
      const rad = k % 3 === 0 ? 2.2 + rng() * 1.6 : 8 + rng() * 5.5;
      props.push({ kind: kinds[Math.floor(rng() * kinds.length)], ang, rad, s: 0.7 + rng() * 0.9, rot: rng() * Math.PI });
    }
    return {
      props,
      angleOffset: rng() * Math.PI * 2,          // NPC 站位整体旋转
      wanderAmp: 0.15 + rng() * 0.5,             // 游走幅度
      wanderSpeed: 0.3 + rng() * 0.7,            // 游走速度
      hueShift: (rng() - 0.5) * 0.12,            // 布光色相偏移
    };
  })();
  const propMat = new THREE.MeshStandardMaterial({ color: TH.ring, roughness: .8 });
  const propMatDim = new THREE.MeshStandardMaterial({ color: TH.ground, roughness: .95 });
  for (const pr of SCENE.props) {
    let mesh;
    if (pr.kind === "crate") {
      mesh = new THREE.Mesh(new THREE.BoxGeometry(.9 * pr.s, .9 * pr.s, .9 * pr.s), propMat);
      mesh.position.set(Math.cos(pr.ang) * pr.rad, .45 * pr.s, Math.sin(pr.ang) * pr.rad);
      mesh.rotation.y = pr.rot;
    } else if (pr.kind === "pillar") {
      mesh = new THREE.Mesh(new THREE.CylinderGeometry(.28 * pr.s, .34 * pr.s, 2.4 * pr.s, 10), propMatDim);
      mesh.position.set(Math.cos(pr.ang) * pr.rad, 1.2 * pr.s, Math.sin(pr.ang) * pr.rad);
    } else if (pr.kind === "lamp") {
      mesh = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(.06, .08, 2.2, 8), propMatDim);
      pole.position.y = 1.1;
      const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(.22, 12, 12),
        new THREE.MeshBasicMaterial({ color: TH.sun }));
      bulb.position.y = 2.3;
      const glow = new THREE.PointLight(TH.sun, .7, 7);
      glow.position.y = 2.3;
      mesh.add(pole, bulb, glow);
      mesh.position.set(Math.cos(pr.ang) * pr.rad, 0, Math.sin(pr.ang) * pr.rad);
    } else {
      mesh = new THREE.Group();
      const top = new THREE.Mesh(new THREE.CylinderGeometry(.9 * pr.s, .9 * pr.s, .12, 16), propMat);
      top.position.y = .8;
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(.12, .16, .8, 8), propMatDim);
      leg.position.y = .4;
      mesh.add(top, leg);
      mesh.position.set(Math.cos(pr.ang) * pr.rad, 0, Math.sin(pr.ang) * pr.rad);
    }
    scene.add(mesh);
  }
  sun.color.offsetHSL(SCENE.hueShift, 0, 0);

  /* ---- AI 画廊墙：素材中心生成的插画挂进场景 ---- */
  (async function loadArtWall() {
    try {
      const res = await fetch("/projects/" + GAME.id + "/art.json", { cache: "no-store" });
      if (!res.ok) return;
      const arts = await res.json();
      if (!Array.isArray(arts) || !arts.length) return;
      const loader = new THREE.TextureLoader();
      loader.setCrossOrigin("anonymous");
      const n = Math.min(arts.length, 6);
      for (let k = 0; k < n; k++) {
        try {
          const tex = await loader.loadAsync(arts[k].file);
          tex.colorSpace = THREE.SRGBColorSpace;
          const w = 2.6, h = 2.6 * (tex.image ? tex.image.height / tex.image.width : 0.75);
          const frame = new THREE.Mesh(
            new THREE.BoxGeometry(w + 0.16, h + 0.16, 0.08),
            new THREE.MeshStandardMaterial({ color: 0x2a2118, roughness: .7 })
          );
          const painting = new THREE.Mesh(
            new THREE.PlaneGeometry(w, h),
            new THREE.MeshStandardMaterial({ map: tex, roughness: .85 })
          );
          painting.position.z = 0.05;
          frame.add(painting);
          const ang = (-Math.PI / 3) + (k / Math.max(n - 1, 1)) * (2 * Math.PI / 3);
          const rad = 13.2;
          frame.position.set(Math.cos(ang) * rad, 3.4, Math.sin(ang) * rad);
          frame.lookAt(0, 3.4, 0);
          scene.add(frame);
          const spot = new THREE.PointLight(TH.sun, 0.9, 9);
          spot.position.set(frame.position.x * 0.82, 5.2, frame.position.z * 0.82);
          scene.add(spot);
        } catch (e) { /* 单张失败不拖垮整墙 */ }
      }
      sys("🖼 画廊墙已挂上 " + n + " 幅 AI 插画（素材中心生成）");
    } catch (e) { /* 无 art.json = 没有自定义插画 */ }
  })();

  /* NPC 实例 */
  const palette = [0x7eb8ff, 0xffb37e, 0x9f8fff, 0x7effc3, 0xff8fb3, 0xffe37e];
  const npcs = [];
  const loader = new GLTFLoader();
  const gltf = await loader.loadAsync(GLB_URL);
  // 模型落地即撤加载指示（此后的 NPC 装配/面板渲染都是同步快速步骤）
  hideBoot();
  AGENTS.forEach((a, i) => {
    const root = gltf.scene.clone(true);
    root.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.color.multiplyScalar(1); } });
    const angle = (i / Math.max(AGENTS.length, 1)) * Math.PI * 2 + SCENE.angleOffset;
    const radius = 4.6 + (i % 3) * 0.45;
    root.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
    root.lookAt(0, 0, 0);
    root.userData = { index: i };
    scene.add(root);
    // 头顶名牌
    const cv = document.createElement("canvas"); cv.width = 256; cv.height = 72;
    const cx = cv.getContext("2d");
    cx.fillStyle = "rgba(13,16,23,.85)"; roundRect(cx, 4, 6, 248, 56, 14); cx.fill();
    cx.fillStyle = "#" + palette[i % palette.length].toString(16).padStart(6, "0");
    cx.font = "bold 30px sans-serif"; cx.textAlign = "center";
    cx.fillText(a.name, 128, 46);
    const tex = new THREE.CanvasTexture(cv);
    const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
    label.scale.set(2.2, 0.62, 1); label.position.set(root.position.x, 3.1, root.position.z);
    scene.add(label);
    let mixer = null;
    try {
      mixer = new THREE.AnimationMixer(root);
      const idle = gltf.animations.find(a => /idle/i.test(a.name)) || gltf.animations[0];
      if (idle) mixer.clipAction(idle).play();
    } catch (e) {}
    npcs.push({ agent: a, root, label, mixer, color: palette[i % palette.length],
      basePos: root.position.clone(), wPhase: i * 1.7 });
  });

  function roundRect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  /* 选择 */
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  let selected = 0;
  renderer.domElement.addEventListener("click", e => {
    const r = renderer.domElement.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hits = ray.intersectObjects(npcs.map(n => n.root), true);
    if (hits.length) {
      let o = hits[0].object;
      while (o && o.userData.index === undefined) o = o.parent;
      if (o) select(o.userData.index);
    }
  });
  function select(i) {
    selected = i;
    npcs.forEach((n, j) => n.label.material.opacity = j === i ? 1 : 0.45);
    sys(`${npcs[i].agent.name}（${npcs[i].agent.role}）注意到了你`);
    renderNpcList();
    refreshBuyBtn();
  }

  /* 对话 */
  const log = document.getElementById("chat-log");
  const say = document.getElementById("say");
  function bubble(role, html) {
    const d = document.createElement("div");
    d.className = "msg " + role; d.innerHTML = html;
    log.appendChild(d);
    while (log.children.length > 60) log.removeChild(log.firstChild);
    log.scrollTop = log.scrollHeight;
    return d;
  }
  const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function sys(text) { bubble("sys", text); }
  function npcLine(i, text) { bubble("npc", `<b>${esc(AGENTS[i].name)}</b><br>${esc(text)}`); }

  /* v0.7.4 前缀缓存契约（与引擎认知系统对齐）：system 只放恒定内容
     （身份/人设/世界观/输出要求），每拍易变项（天数/剧情拍/情绪/记忆）
     全部走 user——system 字节稳定，DeepSeek 类前缀缓存每拍命中。 */
  function systemPrompt(i) {
    const a = AGENTS[i];
    return `「${GAME.name}」游戏原型 NPC。
角色：${a.name}（${a.role}），人设：${a.persona}。
世界观：${STORY.premise}
玩法基调：${GAME.tagline}（${GAME.difficulty}）
要求：始终以 ${a.name} 第一人称说话，2~4 句，符合人设，可推进剧情不跳出世界观。`;
  }
  /* 每拍易变上下文：拼进本轮 user 消息开头 */
  function turnContext(i) {
    const a = AGENTS[i];
    const beat = STORY.beats[storyIdx] || {};
    return `（第${day}天 · 剧情拍：${beat.phase || ""}「${beat.title || ""}」——${beat.desc || ""} · 你当前情绪：${a.mood}）`;
  }

  async function send() {
    const text = say.value.trim(); if (!text) return;
    say.value = ""; bubble("me", esc(text));
    const i = selected;
    if (!providerReady) return ruleReply(i, text);
    const t = bubble("thinking", "……");
    const useSlot = slotDialog || provider;
    try {
      const a = AGENTS[i];
      // 近期对话（本页内存）+ 长期记忆（引擎 MemoryStore 检索）
      const recent = (histMap.get(a.name) || []).slice(-6);
      const recalled = mem.retrieve(a.name, "玩家", text, day, 3)
        .map(e => `· ${e.text}`);
      const memLine = recalled.length ? `\n[${a.name}对玩家的长期记忆]\n${recalled.join("\n")}` : "";
      const msgs = [
        { role: "system", content: systemPrompt(i) },
        ...recent,
        { role: "user", content: turnContext(i) + memLine + "\n玩家：" + text }
      ];
      const out = await useSlot.complete(msgs, { max: 300 });
      t.remove(); npcLine(i, out);
      track("talk");
      const h = histMap.get(a.name) || [];
      h.push({ role: "user", content: text }, { role: "assistant", content: out });
      histMap.set(a.name, h.slice(-12));
      mem.record(a.name, { text: `玩家说：${text}`, about: "玩家", imp: 2, turn: day });
      mem.record(a.name, { text: `我回答：${out.slice(0, 120)}`, about: "玩家", imp: 1, turn: day });
    } catch (e) {
      t.remove(); sys(`（模型调用失败：${esc(String(e.message || e))}，已用性格引擎回复）`);
      ruleReply(i, text);
    }
  }
  const histMap = new Map();
  document.getElementById("send").onclick = send;
  say.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

  function ruleReply(i, text) {
    track("talk");
    const a = AGENTS[i];
    const openers = ["（歪头打量你）", "（放下手里的东西）", "（压低声音）", ""];
    const o = openers[Math.floor(Math.random() * openers.length)];
    const about = (text || "").slice(0, 24);
    npcLine(i, `${o}${about ? "关于「" + about + "」……" : ""}（${a.mood}地）${a.persona.split("，")[0]}。${storyIdx < STORY.beats.length ? "眼下这事，你问倒我了——「" + STORY.beats[storyIdx].title + "」之后再说吧。" : ""}`);
  }

  /* 剧情 */
  let storyIdx = JSON.parse(localStorage.getItem("game." + GAME.id + ".beat") || "0");
  let day = JSON.parse(localStorage.getItem("game." + GAME.id + ".day") || "1");
  function renderStory() {
    clearCountdown(); // 每次重渲染先撤旧计时器，防止过期定时器误触发
    const el = document.getElementById("page-story");
    let html = `<p class="hint" style="margin-bottom:10px">${esc(STORY.premise)}</p>`;
    STORY.beats.forEach((b, i) => {
      const cls = i === storyIdx ? "now" : (i < storyIdx ? "done" : "");
      html += `<div class="beat ${cls}"><div class="ph">${esc(b.phase)}${i < storyIdx ? " · 已完成" : i === storyIdx ? " · 进行中" : ""}</div><div class="tt">${esc(b.title)}</div><div class="ds">${esc(b.desc)}</div></div>`;
    });
    const cur = STORY.beats[storyIdx] || {};
    const chs = (cur.choices || []).filter(c => c && c.label);
    if (storyIdx >= STORY.beats.length) {
      html += `<button disabled>故事已抵达结局</button>`;
    } else if (cur.ending) {
      /* #120 影游腿：ending 节点不再显示推进按钮——按 settle 规则结算并弹出全屏结局 */
      html += renderEnding(cur);
    } else if (cur.video && !videoWatched.has(storyIdx)) {
      /* #120 影游腿：video 舞台节点——先全屏播正片，播完回这里再出选项 */
      html += `<div class="mech"><b>🎬 正片播放中</b><div>全屏镜头结束后回到现场做出选择；也可点击「跳过镜头」。</div></div>`;
      setTimeout(() => {
        if (STORY.beats[storyIdx] === cur) playBeatVideo(cur.video, () => { videoWatched.add(storyIdx); renderStory(); });
      }, 0);
    } else if (chs.length) {
      /* #120 影游腿：带 countdown 的选择拍先渲染倒计时条（动画时长在 startCountdown 写入） */
      if (+cur.countdown > 0) {
        html += `<div id="choice-timer"><div id="choice-timer-bar"></div></div><div id="choice-timer-txt"></div>`;
      }
      html += `<div class="choices">` + chs.map((c, ci) => {
        const eff = parseEffect(c.effect);
        const blocked = choiceBlocked(c);
        return `<button class="choice ${blocked ? "off" : ""}" data-ci="${ci}" ${blocked ? "disabled" : ""}
          title="${blocked ? esc(eff.res) + " 不足" : "前往第 " + (nextOf(c) + 1) + " 拍"}">${esc(c.label)}${eff ? `<i>${esc((eff.d > 0 ? "＋" : "－") + Math.abs(eff.d) + " " + eff.res)}</i>` : ""}</button>`;
      }).join("") + `</div>`;
    } else {
      html += `<button id="btn-next">推进剧情 → 第 ${storyIdx + 1} 拍</button>`;
    }
    el.innerHTML = html;
    const btn = document.getElementById("btn-next");
    if (btn) btn.onclick = () => advanceTo(storyIdx + 1, null);
    el.querySelectorAll(".choice").forEach(b2 => b2.onclick = () => {
      const c = chs[+b2.dataset.ci];
      advanceTo(nextOf(c), c.effect);
    });
    // 倒计时只在「真渲染了选项」时启动（video 未播完时不启动，结局拍不启动）
    if (!cur.ending && !(cur.video && !videoWatched.has(storyIdx)) && chs.length && +cur.countdown > 0) {
      startCountdown(+cur.countdown, chs);
    }
  }
  /* 分支数据模型:c.next = 目标拍序号(0 起);省略/-1 = 顺延;effect = "资源±数量" */
  function parseEffect(s) {
    if (!s) return null;
    const m = String(s).trim().match(/^(.+?)([+\-＋－])(\d+)$/);
    return m ? { res: m[1].trim(), d: (m[2] === "+" || m[2] === "＋" ? 1 : -1) * (+m[3]) } : null;
  }
  function nextOf(c) {
    const n = c && c.next;
    return (n === null || n === undefined || n < 0) ? storyIdx + 1 : Math.min(Math.max(0, n), STORY.beats.length);
  }
  async function advanceTo(target, effectStr) {
    if (storyIdx >= STORY.beats.length) return;
    clearCountdown(); // 先撤倒计时：导演 AI await 期间计时器若再触发会造成双重推进
    const b = STORY.beats[storyIdx];
    const eff = parseEffect(effectStr);
    if (eff) {
      if (VAR_NAMES.has(eff.res)) {
        /* #120 影游腿：结局 settle 规则声明过的变量进变量袋（负值钳 0，不阻塞选择） */
        varAdd(eff.res, eff.d, "分支选择");
      } else {
        if (eff.d < 0 && resAmount(eff.res) < -eff.d) { sys(`${eff.res}不足（需要 ${-eff.d}）`); renderStory(); return; }
        resAdd(eff.res, eff.d, "分支选择");
      }
    }
    sys(`📖 第 ${day} 天 · 剧情推进：「${b.title}」`);
    if (providerReady) {
      const t = bubble("thinking", "导演系统正在运镜……");
      try {
        const out = await (slotDirector || provider).complete([
          { role: "system", content: "你是游戏导演系统（DirectorSystem），用 2~3 句有画面感的中文旁白演绎当前剧情节拍，不要解释。" },
          { role: "user", content: `前提：${STORY.premise}\n节拍：${b.phase}「${b.title}」——${b.desc}\n玩家已进行到第${day}天。` }
        ], { max: 200 });
        t.remove(); bubble("npc", `<b>🎬 导演</b><br>${esc(out)}`);
      } catch (e) { t.remove(); }
    } else {
      bubble("npc", `<b>🎬 导演</b><br>${esc(b.desc)}`);
    }
    storyIdx = target; day++;
    track("advance");
    resAdd(RES[0], 15, "剧情推进奖励");
    localStorage.setItem("game." + GAME.id + ".beat", JSON.stringify(storyIdx));
    localStorage.setItem("game." + GAME.id + ".day", JSON.stringify(day));
    document.getElementById("day").textContent = day;
    renderStory(); renderCodex();
  }

  /* ---- 经济账本（v0.3 真逻辑）：玩法模板的资源就是真实数值 ---- */
  const RES_NAMES = ((GAME.economy || []).map(r => (r && r.name) ? r.name : String(r)).filter(Boolean));
  const RES = RES_NAMES.length ? RES_NAMES : ["金币"];
  const RES_KEY = "game." + GAME.id + ".res";
  let resBag = JSON.parse(localStorage.getItem(RES_KEY) || "{}");
  if (!(RES[0] in resBag)) { // 旧存档的「金币」迁移为模板主资源
    const legacy = +(localStorage.getItem("game." + GAME.id + ".coins") || 0);
    if (legacy) resBag[RES[0]] = legacy;
  }
  function resAmount(n) { return resBag[n] | 0; }
  function resAdd(n, d, why) {
    resBag[n] = Math.max(0, (resBag[n] | 0) + d);
    localStorage.setItem(RES_KEY, JSON.stringify(resBag));
    renderRes();
    if (why) sys(`${d > 0 ? "＋" : "－"}${Math.abs(d)} ${n}（${why}）`);
  }
  function renderRes() {
    const el = document.getElementById("res-chips");
    if (el) el.innerHTML = RES.slice(0, 4).map(n =>
      `<span class="chip">${esc(n)} <b style="color:#ffd88a">${resAmount(n)}</b></span>`).join("");
  }
  function earn(n, why) { resAdd(RES[0], n, why); }

  /* ==================== #120 影游可执行腿 ====================
     三个能力全部按「字段存在性」守卫：beats 节点不含 countdown/ending/video
     字段时走旧路径，其余 16 个玩法包零回归。
     ---- 变量袋 ----
     与 resBag 同款 localStorage 约定，独立键 game.<id>.vars（导出存档自动带上）。
     变量名集合 = ending 节点 settle 规则里声明的名字（如 "affinity>=2" 的 affinity）
                ∪ 选择 effect 里出现的、但不在 economy 资源表里的名字。
     命中变量袋的 effect 不占 HUD 资源条，只延迟到 ending 节点一次性结算——
     避免被「剧情推进奖励 +15」这类主资源流水稀释结算语义。 */
  const VARS_KEY = "game." + GAME.id + ".vars";
  let varBag = (() => {
    try { return JSON.parse(localStorage.getItem(VARS_KEY) || "{}"); } catch (e) { return {}; }
  })();
  const VAR_NAMES = (() => {
    const s = new Set();
    const addRule = rule => {
      const m = typeof rule === "string" ? rule.trim().match(/^([A-Za-z_][A-Za-z0-9_]*)\s*>=/) : null;
      if (m) s.add(m[1]);
    };
    STORY.beats.forEach(b => {
      if (b && b.settle && typeof b.settle === "object" && !Array.isArray(b.settle)) {
        Object.values(b.settle).forEach(addRule);
      }
      (b && b.choices || []).forEach(c => {
        const eff = parseEffect(c && c.effect);
        if (eff && !RES_NAMES.includes(eff.res)) s.add(eff.res);
      });
    });
    return s;
  })();
  function varAmount(n) { return varBag[n] | 0; }
  function varAdd(n, d, why) {
    varBag[n] = Math.max(0, (varBag[n] | 0) + d);
    localStorage.setItem(VARS_KEY, JSON.stringify(varBag));
    if (why) sys(`${d > 0 ? "＋" : "－"}${Math.abs(d)} ${n}（${why}）`);
  }
  /* settle 规则求值："*"=通配恒真；"变量>=数值"查变量袋；其余写法视为不成立 */
  function evalRule(rule) {
    if (rule === "*" || rule === undefined || rule === null || rule === "") return true;
    const m = String(rule).trim().match(/^([A-Za-z_][A-Za-z0-9_]*)\s*>=\s*(\d+)$/);
    return m ? varAmount(m[1]) >= +m[2] : false;
  }
  /* 按 settle 声明顺序取第一个命中的分支（模板应兜底 "*" 分支） */
  function settleBranch(settle) {
    for (const [branch, rule] of Object.entries(settle || {})) {
      if (evalRule(rule)) return branch;
    }
    return null;
  }
  /* 选择是否因资源不足而禁用：变量袋负值钳 0 永不阻塞，只有主资源可能不足 */
  function choiceBlocked(c) {
    const eff = parseEffect(c.effect);
    return !!(eff && eff.d < 0 && !VAR_NAMES.has(eff.res) && resAmount(eff.res) < -eff.d);
  }
  /* ---- choice 倒计时：beat.countdown = N 秒。CSS scaleX 动画 + 文本秒数，
     归零自动选第一个可用选项。deadline 用绝对时间算剩余，后台节流不歪。 ---- */
  let cdTimer = null;
  function clearCountdown() {
    if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
  }
  function startCountdown(sec, chs) {
    clearCountdown();
    const bar = document.getElementById("choice-timer-bar");
    const txt = document.getElementById("choice-timer-txt");
    if (!bar || !txt || !chs.length) return;
    bar.style.animation = `cdshrink ${sec}s linear forwards`;
    const deadline = Date.now() + sec * 1000;
    cdTimer = setInterval(() => {
      const left = deadline - Date.now();
      if (left <= 0) {
        clearCountdown();
        sys("⏳ 倒计时归零——故事替你做了决定");
        const pick = chs.find(c => !choiceBlocked(c)) || chs[0];
        advanceTo(nextOf(pick), pick.effect);
        return;
      }
      txt.textContent = `⏳ ${Math.ceil(left / 1000)} 秒后自动选择`;
    }, 250);
  }
  /* ---- video 舞台节点：beat.video = "clips/xxx.mp4"（相对 → /projects/{id}/ 下）
     或 "/assets/..."（素材库绝对路径）。播完/跳过/加载失败/自动播放被拦 → 回场景出选项。 ---- */
  const videoWatched = new Set(); // 本次会话已播过的拍（不落盘：重进该拍会重播）
  function resolveVideoUrl(v) {
    const s = String(v);
    return s.startsWith("/") ? s : "/projects/" + GAME.id + "/" + s;
  }
  function playBeatVideo(src, onDone) {
    const stage = document.getElementById("video-stage");
    const vid = document.getElementById("video-el");
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      vid.onended = vid.onerror = null;
      vid.pause(); vid.removeAttribute("src"); vid.load();
      stage.style.display = "none";
      sceneEl.classList.remove("dimmed");
      onDone();
    };
    sceneEl.classList.add("dimmed"); // 3D 场景淡出，让位正片
    stage.style.display = "flex";
    document.getElementById("video-skip").onclick = finish;
    vid.onended = finish;
    vid.onerror = () => { sys("（本镜头视频素材缺失，已自动跳过）"); finish(); };
    vid.src = resolveVideoUrl(src);
    vid.play().catch(() => { sys("（浏览器拦截了自动播放，已跳过镜头）"); finish(); });
  }
  /* ---- ending 结算：剧情页小结 + 全屏结局画面。
     结局标题/评语优先取 beat.ending_titles / beat.ending_lines（分支键 → 文案），
     缺省回落到通用文案，运行时不写死任何一部作品的结局。 ---- */
  function renderEnding(cur) {
    const branch = settleBranch(cur.settle) || "lose";
    const titles = (cur.ending_titles && typeof cur.ending_titles === "object") ? cur.ending_titles : {};
    const lines = (cur.ending_lines && typeof cur.ending_lines === "object") ? cur.ending_lines : {};
    const title = titles[branch] || `${cur.title}（${branch}）`;
    const line = lines[branch] || `这是「${branch}」分支的结局——本局的选择已经尘埃落定。`;
    document.getElementById("ending-title").textContent = title;
    document.getElementById("ending-line").textContent = line;
    document.getElementById("ending-vars").innerHTML = [...VAR_NAMES].map(n =>
      `<span class="chip">${esc(n)} <b style="color:#ffd88a">${varAmount(n)}</b></span>`).join("");
    document.getElementById("ending").style.display = "flex";
    sys(`🎬 结局结算：「${title}」`);
    return `<div class="beat now"><div class="ph">${esc(cur.phase)} · 已结算</div><div class="tt">🎬 ${esc(title)}</div><div class="ds">${esc(line)}</div></div>
      <p class="hint">点击画面中央的「重新体验」清空本作存档、从头再来。</p>`;
  }
  /* 「重新体验」：清掉本作全部 localStorage 键（beat/day/res/vars/loop/llmledger/记忆）后重开 */
  function restartGame() {
    const prefix = "game." + GAME.id + ".";
    const kill = [];
    for (let k = 0; k < localStorage.length; k++) {
      const key = localStorage.key(k);
      if (key && key.startsWith(prefix)) kill.push(key);
    }
    kill.forEach(k => localStorage.removeItem(k));
    location.reload();
  }
  document.getElementById("btn-restart").onclick = restartGame;
  /* =================== #120 影游可执行腿（完） =================== */

  const buyBtn = document.getElementById("buy-hint");
  function refreshBuyBtn() {
    const a = AGENTS[selected];
    const can = /商人|向导|情报|守灯|收藏|医师|医生|祭司/.test(a?.role || "") || /商|贩|情报|向导/.test(a?.name || "");
    buyBtn.style.display = can ? "" : "none";
  }
  buyBtn.onclick = async () => {
    if (resAmount(RES[0]) < 10) { sys(`${RES[0]}不够（现有 ${resAmount(RES[0])}，需要 10）——推进剧情可获得更多`); return; }
    const i = selected, a = AGENTS[i];
    resAdd(RES[0], -10, "购买线索");
    track("buy");
    const beat = STORY.beats[Math.min(storyIdx, STORY.beats.length - 1)] || {};
    if (providerReady) {
      const t = bubble("thinking", "（TA 环顾四周，压低声音……）");
      try {
        const out = await (slotDialog || provider).complete([
          { role: "system", content: `你是${a.name}（${a.role}）。玩家花10金币向你买剧情线索时，按人设用1~2句悄悄透露真实有用的信息。` },
          { role: "user", content: `${turnContext(i)}\n（玩家递上金币买当前剧情「${beat.title || "?"}」的线索）这是金币。说吧，你知道什么？` }
        ], { max: 120 });
        t.remove(); npcLine(i, out);
      } catch (e) { t.remove(); sys("（交易被打断了……）"); }
    } else {
      npcLine(i, `（收下金币，压低声音）关于「${beat.title || "眼下的局面"}」——${beat.desc || "风声很紧，自己当心。"}`);
    }
  };

  /* ---- 存档导出/导入（v0.2）：打包本游戏全部 localStorage ---- */
  function exportSave() {
    const data = {};
    for (let k = 0; k < localStorage.length; k++) {
      const key = localStorage.key(k);
      if (key && key.startsWith("game." + GAME.id + ".")) data[key] = localStorage.getItem(key);
    }
    const blob = new Blob([JSON.stringify({ game: GAME.id, saved_at: Date.now(), data }, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `oriera-存档-${GAME.id}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }
  function importSave(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result);
        Object.entries(j.data || {}).forEach(([k, v]) => localStorage.setItem(k, v));
        location.reload();
      } catch (e) { sys("存档文件无法识别"); }
    };
    r.readAsText(file);
  }

  /* ---- 导演队列（P3 契约：一切经队列、一切有预算）----
     不再是裸 setInterval 直调 LLM：间隔抖动 + 失败指数退避（防 429 风暴）+ 调用计量落盘。
     预算账本在「玩法」面板可见。 */
  const LLM_LEDGER_KEY = "game." + GAME.id + ".llmledger";
  const ledger = (() => {
    try { return JSON.parse(localStorage.getItem(LLM_LEDGER_KEY)) || { calls: 0, fails: 0 }; }
    catch { return { calls: 0, fails: 0 }; }
  })();
  function saveLedger() { localStorage.setItem(LLM_LEDGER_KEY, JSON.stringify(ledger)); }
  function bill(ok) { ledger.calls++; if (!ok) ledger.fails++; saveLedger(); }

  /* 玩法图鉴（v0.3 真逻辑）：核心循环按玩家真实行为自动追踪 */
  const doneManual = new Set(JSON.parse(localStorage.getItem("game." + GAME.id + ".loop") || "[]"));
  const doneAuto = new Set(JSON.parse(localStorage.getItem("game." + GAME.id + ".loopAuto") || "[]"));
  const stepDone = i => doneManual.has(i) || doneAuto.has(i);
  /* 行为→步骤归类：对话类/交易类靠关键词，其余随剧情推进 */
  function stepKind(s) {
    if (/对话|社交|询问|聊天|交流|谈判|打听/.test(s)) return "talk";
    if (/交易|购买|经济|商店|花钱|买/.test(s)) return "buy";
    return "advance";
  }
  function track(kind) {
    let hit = false;
    GAME.core_loop.forEach((s, i) => {
      if (stepDone(i) || stepKind(s) !== kind) return;
      doneAuto.add(i); hit = true;
    });
    if (!hit) return;
    localStorage.setItem("game." + GAME.id + ".loopAuto", JSON.stringify([...doneAuto]));
    renderCodex();
    sys("🎯 核心循环推进（按真实行为自动点亮）");
  }
  function renderCodex() {
    let html = "<h4>核心循环 <span style='font-size:11px;color:#6fd3a0'>按你的真实行为自动追踪</span></h4>";
    GAME.core_loop.forEach((s, i) => {
      const auto = doneAuto.has(i) && !doneManual.has(i);
      html += `<div class="loop-step ${stepDone(i) ? "done" : ""}" data-i="${i}"><span>${stepDone(i) ? "✅" : "▫️"}</span>${esc(s)}${auto ? "<span class='loop-auto'>自动</span>" : ""}</div>`;
    });
    html += "<h4>机制系统</h4>";
    GAME.mechanics.forEach(m => { html += `<div class="mech"><b>${esc(m.name)}</b><div>${esc(m.detail)}</div></div>`; });
    html += "<h4>经济循环</h4><table class=\"eco\"><tr><th>资源</th><th>来源</th><th>去向</th></tr>";
    GAME.economy.forEach(r => { html += `<tr><td>${esc(r.name)}</td><td>${esc(r.source)}</td><td>${esc(r.sink)}</td></tr>`; });
    html += `</table><h4>难度曲线</h4><div class="mech"><div>${esc(GAME.difficulty)}</div></div>`;
    html += `<h4>AI 用量</h4><div class="mech"><div>本局 AI 对话 <b>${ledger.calls}</b> 次（失败 ${ledger.fails} 次）。NPC 自言自语走导演队列：主动错开时间、失败自动等待，不会刷爆 API 额度。</div><div id="ai-ledger-detail" style="margin-top:4px;color:#8a93ad">${aiStatsLine()}</div></div>`;
    html += `<h4>存档</h4><div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="btn-export-save" style="background:#2d5b9e;color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px">📤 导出存档</button>
      <button id="btn-import-save" style="background:#161a28;color:#cdd6ec;border:1px solid #2a3a5c;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px">📥 导入存档</button>
      <input type="file" id="save-file" accept="application/json" style="display:none" />
    </div>
    <p style="color:#5f6b8a;font-size:11px;margin:8px 0 0">金币与记忆都在浏览器里——换电脑前记得导出。</p>`;
    const el = document.getElementById("page-codex");
    el.innerHTML = html;
    el.querySelector("#btn-export-save").onclick = exportSave;
    el.querySelector("#btn-import-save").onclick = () => el.querySelector("#save-file").click();
    el.querySelector("#save-file").onchange = e => { if (e.target.files[0]) importSave(e.target.files[0]); };
    el.querySelectorAll(".loop-step").forEach(d => d.onclick = () => {
      const i = +d.dataset.i;
      doneManual.has(i) ? doneManual.delete(i) : doneManual.add(i);
      localStorage.setItem("game." + GAME.id + ".loop", JSON.stringify([...doneManual]));
      renderCodex();
    });
  }

  /* 居民列表 */
  function renderNpcList() {
    const el = document.getElementById("page-npcs");
    el.innerHTML = AGENTS.map((a, i) => `
      <div class="npc-row ${i === selected ? "sel" : ""}" data-i="${i}">
        <div class="npc-ava" style="background:#${npcs[i].color.toString(16).padStart(6,"0")}22;border:2px solid #${npcs[i].color.toString(16).padStart(6,"0")}"></div>
        <div><div class="npc-nm">${esc(a.name)} <span class="npc-rl">· ${esc(a.role)}</span></div>
        <div class="npc-pf">${esc(a.persona)}</div></div>
      </div>`).join("");
    el.querySelectorAll(".npc-row").forEach(d => d.onclick = () => select(+d.dataset.i));
  }

  /* Tabs */
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll(".tab-page").forEach(p => p.classList.remove("on"));
    document.getElementById("page-" + b.dataset.t).classList.add("on");
  });

  /* 开场 */
  document.getElementById("tagline").textContent = GAME.tagline;
  document.getElementById("day").textContent = day;
  renderRes();
  renderStory(); renderCodex(); renderNpcList(); select(0);
  npcs[0] && sys(`欢迎来到「${esc(GAME.name)}」。${esc(AGENTS[0].name)}正在看你——去和 TA 说说第一句话吧。`);
  // NPC 开场白（顺序错开）
  AGENTS.forEach((a, i) => setTimeout(() => {
    if (i === selected) npcLine(i, a.first_line);
    else sys(`${a.name}（${a.role}）：「${a.first_line}」`);
  }, 600 + i * 2600));

  /* ---- 导演队列（P3 契约：一切经队列、一切有预算）----
     不再是裸 setInterval 直调 LLM：间隔抖动 + 失败指数退避（防 429 风暴）+ 调用计量落盘。
     预算账本在「玩法」面板可见（账本本体已前移到首次渲染之前，避免 TDZ）。 */

  /* v0.7.5 成本可视化（评审：优化不可感知=没发生）：读引擎 provider.stats
     （calls/tokens/cached，与 Rust 对镜的缓存钳制口径），HUD 简读 + 玩法面板详读。 */
  function aiStatsAgg() {
    const agg = { calls: 0, tokens: 0, cached: 0 };
    const seen = new Set();
    [slotDialog, slotDirector, provider].forEach(p => {
      if (p && !seen.has(p)) {
        seen.add(p);
        agg.calls += (p.stats && p.stats.calls) || 0;
        agg.tokens += (p.stats && p.stats.tokens) || 0;
        agg.cached += (p.stats && p.stats.cached) || 0;
      }
    });
    return agg;
  }
  function aiStatsLine() {
    const a = aiStatsAgg();
    if (!a.calls) return "还没调用过 AI——配置模型后这里实时显示用量与省钱额。";
    const hit = a.tokens ? Math.round((a.cached / a.tokens) * 100) : 0;
    return `累计 ${a.tokens.toLocaleString()} tokens · 缓存命中 ${hit}%（重复的上下文不再重复计费）`;
  }
  function refreshAiChip() {
    const el = document.getElementById("ai-chip");
    if (!el) return;
    const a = aiStatsAgg();
    if (!a.calls) { el.style.display = "none"; return; }
    const hit = a.tokens ? Math.round((a.cached / a.tokens) * 100) : 0;
    el.textContent = `AI · ${a.calls} 次对话 · 缓存命中 ${hit}%`;
    el.style.display = "";
    const detail = document.getElementById("ai-ledger-detail");
    if (detail) detail.textContent = aiStatsLine();
  }
  setInterval(refreshAiChip, 5000);

  let directorBackoff = 1;
  const DIRECTOR_BASE = 45000;
  function directorTick() {
    const jitter = 0.8 + Math.random() * 0.4; // ±20% 抖动，避免节拍式请求
    setTimeout(async () => {
      if (providerReady && !document.hidden) {
        const i = Math.floor(Math.random() * AGENTS.length);
        try {
          // 注意：messages 不能只有 system——智谱/DeepSeek 等端点会直接 400
          const out = await (slotDialog || provider).complete([
            { role: "system", content: systemPrompt(i) + "\n没被对话时也会自然地自言自语或对世界感慨一两句。" },
            { role: "user", content: turnContext(i) + "\n（此刻你在做什么？自然地说一句话）" }
          ], { max: 90 });
          bill(true);
          directorBackoff = 1;
          if (i === selected) npcLine(i, out); else sys(`${AGENTS[i].name}：「${out}」`);
        } catch (e) {
          bill(false);
          directorBackoff = Math.min(directorBackoff * 2, 7); // 失败翻倍退避，封顶约 5 分钟
        }
      }
      directorTick();
    }, DIRECTOR_BASE * directorBackoff * jitter);
  }
  directorTick();

  /* 主循环 */
  const clock = new THREE.Clock();
  (function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    npcs.forEach((n, j) => {
      n.label.position.y = 3.1 + Math.sin(clock.elapsedTime * 2 + j) * 0.06;
      if (n.mixer) n.mixer.update(dt);
      if (j === selected) n.root.rotation.y += 0.004;
      // 按包种子节奏的原地游走（不改变 NPC 与玩家的相对站圈）
      const t2 = clock.elapsedTime * SCENE.wanderSpeed + n.wPhase;
      n.root.position.x = n.basePos.x + Math.sin(t2) * SCENE.wanderAmp;
      n.root.position.z = n.basePos.z + Math.cos(t2 * 0.8) * SCENE.wanderAmp;
    });
    controls.update();
    renderer.render(scene, camera);
  })();
  window.addEventListener("resize", () => {
    camera.aspect = sceneEl.clientWidth / sceneEl.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(sceneEl.clientWidth, sceneEl.clientHeight);
  });
}
boot();
</script>
</body>
</html>
