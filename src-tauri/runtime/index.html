<!doctype html>

<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #0d1017; color: #e6e8ef;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  #app { display: flex; height: 100%; }
  #scene { flex: 1; position: relative; min-width: 0; }
  #scene canvas { display: block; }
  #hud { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; gap: 10px;
    align-items: center; pointer-events: none; }
  .chip { background: rgba(13,16,23,.82); border: 1px solid #2a3a5c; border-radius: 20px;
    padding: 6px 14px; font-size: 12px; color: #aeb6cc; pointer-events: auto; }
  #dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #556; margin-right: 6px; }
  #dot.live { background: #35d07f; box-shadow: 0 0 8px #35d07f; }
  #panel { width: 400px; background: #12151f; border-left: 1px solid #232a3d; display: flex; flex-direction: column; }
  #tabs { display: flex; border-bottom: 1px solid #232a3d; }
  #tabs button { flex: 1; background: none; border: none; color: #7c86a3; padding: 12px 4px;
    font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
  #tabs button.on { color: #7eb8ff; border-bottom-color: #7eb8ff; }
  .tab-page { flex: 1; overflow-y: auto; padding: 14px; display: none; }
  .tab-page.on { display: block; }
  #chat-log { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .msg { max-width: 92%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.65; white-space: pre-wrap; }
  .msg.npc { background: #1b2336; border: 1px solid #2c3c5e; align-self: flex-start; }
  .msg.me { background: #1d3a5f; align-self: flex-end; }
  .msg.sys { color: #7c86a3; font-size: 12px; align-self: center; }
  .msg b { color: #9fc3ff; }
  #chat-input { display: flex; gap: 8px; }
  #chat-input input { flex: 1; background: #0d1017; border: 1px solid #2a3a5c; color: #e6e8ef;
    border-radius: 8px; padding: 10px 12px; font-size: 13px; outline: none; }
  #chat-input button { background: #2d5b9e; border: none; color: #fff; border-radius: 8px;
    padding: 0 18px; cursor: pointer; font-size: 13px; }
  #chat-input button:disabled { background: #2a3348; cursor: default; }
  .beat { border-left: 3px solid #2a3a5c; padding: 8px 12px; margin-bottom: 10px; border-radius: 0 8px 8px 0;
    background: #161a28; }
  .beat.now { border-left-color: #7eb8ff; background: #1a2440; }
  .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .choice { display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%;
    background: #1a2440; color: #cdd6ec; border: 1px solid #2d5b9e; border-radius: 10px;
    padding: 10px 14px; cursor: pointer; font-size: 13px; text-align: left; }
  .choice:hover { background: #223055; }
  .choice i { color: #8fa3c8; font-style: normal; font-size: 11px; flex: none; }
  .choice.off { opacity: .4; cursor: not-allowed; }
  .loop-auto { font-size: 10px; color: #6fd3a0; border: 1px solid #2d6a4a; border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
  .beat.done { opacity: .45; }
  .beat .ph { font-size: 11px; color: #7c86a3; }
  .beat .tt { font-size: 13.5px; font-weight: 700; margin: 2px 0; }
  .beat .ds { font-size: 12.5px; color: #aeb6cc; line-height: 1.6; }
  #btn-next { width: 100%; margin: 6px 0 14px; padding: 11px; background: #2d5b9e; color: #fff;
    border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #btn-next:disabled { background: #2a3348; }
  .codex h4 { margin: 14px 0 8px; font-size: 13px; color: #9fc3ff; }
  .codex h4:first-child { margin-top: 0; }
  .loop-step { display: flex; gap: 8px; align-items: center; padding: 7px 10px; background: #161a28;
    border-radius: 8px; margin-bottom: 6px; font-size: 13px; cursor: pointer; }
  .loop-step.done { color: #5f6b8a; text-decoration: line-through; }
  .mech { background: #161a28; border-radius: 8px; padding: 9px 12px; margin-bottom: 6px; }
  .mech b { font-size: 13px; color: #cdd6ec; }
  .mech div { font-size: 12px; color: #8a93ad; margin-top: 2px; line-height: 1.55; }
  table.eco { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.eco th { text-align: left; color: #7c86a3; padding: 4px 6px; font-weight: 500; }
  table.eco td { padding: 5px 6px; border-top: 1px solid #1e2536; color: #b6bfd6; }
  #npc-list .npc-row { display: flex; gap: 10px; padding: 10px; background: #161a28; border-radius: 10px;
    margin-bottom: 8px; cursor: pointer; align-items: center; }
  #npc-list .npc-row:hover, #npc-list .npc-row.sel { background: #1a2440; }
  .npc-ava { width: 38px; height: 38px; border-radius: 10px; flex: none; }
  .npc-nm { font-size: 13.5px; font-weight: 700; }
  .npc-rl { font-size: 11px; color: #7c86a3; }
  .npc-pf { font-size: 11.5px; color: #8a93ad; margin-top: 3px; line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #fallback { position: fixed; inset: 0; background: #0d1017ee; display: none; align-items: center;
    justify-content: center; z-index: 99; text-align: center; padding: 40px; line-height: 2; }
  .hint { font-size: 12px; color: #7c86a3; margin-top: 8px; }
  .thinking { color: #7c86a3; font-size: 12px; align-self: flex-start; }
</style>

  <div id="scene">
    <div id="hud">
      <div class="chip"><b style="color:#9fc3ff">__PROJECT_NAME__</b> · <span id="tagline"></span></div>
      <div class="chip">第 <b id="day" style="color:#e8d78a">1</b> 天</div>

<div id="fallback">
  <div>
    <div style="font-size:40px">🌌</div>
    <h2 style="margin:12px 0">请通过 OriEra Studio 打开本项目</h2>
    <p style="color:#8a93ad">生成的游戏原型依赖 Studio 内置的引擎服务与静态服务器。</p>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "/examples/11-ai-cafe/vendor/three.module.js",
  "oriera-vendor/OrbitControls.js": "/examples/11-ai-cafe/vendor/OrbitControls.js",
  "oriera-vendor/GLTFLoader.js": "/examples/11-ai-cafe/vendor/GLTFLoader.js",
  "oriera-vendor/utils/BufferGeometryUtils.js": "/examples/11-ai-cafe/vendor/utils/BufferGeometryUtils.js",
  "oriera-vendor/RobotExpressive.glb": "/examples/11-ai-cafe/vendor/RobotExpressive.glb",
  "oriera-kernel": "/examples/11-ai-cafe/engine/kernel.js"
} }
</script>
<script type="module">
/* ============ 游戏数据（由 OriEra Studio 生成时注入） ============ */
const GAME = __GAME_JSON__;
const STORY = __STORY_JSON__;
const AGENTS = __AGENTS_JSON__;
/* bare specifier 走 importmap：Studio 模式指向内置快照，
   单文件导出时由导出器把映射值换成 data URL，双击即玩。 */
const KERNEL = "oriera-kernel";
const GLB_URL = "oriera-vendor/RobotExpressive.glb";

/* ============ L7 provider 装配（与引擎 café demo 同一机制） ============ */
let provider = null, providerReady = false;
const savedCfg = JSON.parse(localStorage.getItem("aicafe.llm.v1") || "null");
async function boot() {
  let mod;
  try {
    mod = await import(KERNEL);
  } catch (e) {
    document.getElementById("fallback").style.display = "flex";
    return;
  }
  if (savedCfg && savedCfg.key && savedCfg.kind !== "rule") {
    provider = mod.createProvider(savedCfg);
    providerReady = !!(provider && provider.ready);
  }
  if (providerReady) {
    document.getElementById("prov-name").textContent =
      (savedCfg.model || "llm") + "（引擎 L7 · AI 已植入）";
    document.getElementById("dot").classList.add("live");
  }
  await startScene(mod);
}

/* ============ 场景 ============ */
async function startScene(mod) {
  const THREE = await import("three");
  const { OrbitControls } = await import("oriera-vendor/OrbitControls.js");
  const { GLTFLoader } = await import("oriera-vendor/GLTFLoader.js");
  const mem = new mod.MemoryStore("game." + GAME.id + ".mem.v1");

  /* ---- 主题（v0.2）：space / cafe / dungeon / snow ---- */
  const THEMES = {
    space:   { bg: 0x0d1017, ground: 0x1a2438, ring: 0x2d5b9e, hemiSky: 0x8fb5ff, hemiGnd: 0x22283a, sun: 0xffe9c4 },
    cafe:    { bg: 0x1a1410, ground: 0x3a2c1e, ring: 0xc98d4e, hemiSky: 0xffd9a0, hemiGnd: 0x2a2018, sun: 0xffc37e },
    dungeon: { bg: 0x0a0d12, ground: 0x161c26, ring: 0x8a5a2e, hemiSky: 0x5a6b8e, hemiGnd: 0x0e1116, sun: 0xff9a4d },
    snow:    { bg: 0xd8e2ee, ground: 0xeef3f9, ring: 0x7ea8d8, hemiSky: 0xffffff, hemiGnd: 0xb8c8dd, sun: 0xfff4e0 },
  };
  const TH = THEMES[GAME.theme] || THEMES.space;

  const sceneEl = document.getElementById("scene");
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(sceneEl.clientWidth, sceneEl.clientHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  sceneEl.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(TH.bg);
  scene.fog = new THREE.Fog(TH.bg, 18, 55);
  const camera = new THREE.PerspectiveCamera(50, sceneEl.clientWidth / sceneEl.clientHeight, 0.1, 200);
  camera.position.set(0, 6, 14);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.2, 0);
  controls.enableDamping = true; controls.maxPolarAngle = Math.PI / 2.05;
  controls.minDistance = 6; controls.maxDistance = 30;

  scene.add(new THREE.HemisphereLight(TH.hemiSky, TH.hemiGnd, 1.1));
  const sun = new THREE.DirectionalLight(TH.sun, 1.6);
  sun.position.set(6, 10, 4); scene.add(sun);
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(16, 48).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: TH.ground, roughness: .95 }));
  scene.add(ground);
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(15.4, 16, 64).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: TH.ring, transparent: true, opacity: .5 }));
  scene.add(ring);

  /* ---- 场景差异化（按玩法包种子确定性生成）----
     同一套主题下，不同玩法包的地貌道具、布光偏移、NPC 游走节奏都不同——
     「赛车」和「农场」进游戏不再是同一张素圈地图。 */
  const SCENE = (() => {
    let seed = 2166136261;
    for (const c of (GAME.gameplay_id || GAME.id || "oriera")) {
      seed ^= c.codePointAt(0);
      seed = Math.imul(seed, 16777619);
    }
    let st = seed >>> 0;
    const rng = () => ((st = (st * 1664525 + 1013904223) >>> 0) / 4294967296);
    const kinds = ["crate", "pillar", "lamp", "table"];
    const props = [];
    const n = 7 + Math.floor(rng() * 8);
    for (let k = 0; k < n; k++) {
      const ang = rng() * Math.PI * 2;
      const rad = k % 3 === 0 ? 2.2 + rng() * 1.6 : 8 + rng() * 5.5;
      props.push({ kind: kinds[Math.floor(rng() * kinds.length)], ang, rad, s: 0.7 + rng() * 0.9, rot: rng() * Math.PI });
    }
    return {
      props,
      angleOffset: rng() * Math.PI * 2,          // NPC 站位整体旋转
      wanderAmp: 0.15 + rng() * 0.5,             // 游走幅度
      wanderSpeed: 0.3 + rng() * 0.7,            // 游走速度
      hueShift: (rng() - 0.5) * 0.12,            // 布光色相偏移
    };
  })();
  const propMat = new THREE.MeshStandardMaterial({ color: TH.ring, roughness: .8 });
  const propMatDim = new THREE.MeshStandardMaterial({ color: TH.ground, roughness: .95 });
  for (const pr of SCENE.props) {
    let mesh;
    if (pr.kind === "crate") {
      mesh = new THREE.Mesh(new THREE.BoxGeometry(.9 * pr.s, .9 * pr.s, .9 * pr.s), propMat);
      mesh.position.set(Math.cos(pr.ang) * pr.rad, .45 * pr.s, Math.sin(pr.ang) * pr.rad);
      mesh.rotation.y = pr.rot;
    } else if (pr.kind === "pillar") {
      mesh = new THREE.Mesh(new THREE.CylinderGeometry(.28 * pr.s, .34 * pr.s, 2.4 * pr.s, 10), propMatDim);
      mesh.position.set(Math.cos(pr.ang) * pr.rad, 1.2 * pr.s, Math.sin(pr.ang) * pr.rad);
    } else if (pr.kind === "lamp") {
      mesh = new THREE.Group();
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(.06, .08, 2.2, 8), propMatDim);
      pole.position.y = 1.1;
      const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(.22, 12, 12),
        new THREE.MeshBasicMaterial({ color: TH.sun }));
      bulb.position.y = 2.3;
      const glow = new THREE.PointLight(TH.sun, .7, 7);
      glow.position.y = 2.3;
      mesh.add(pole, bulb, glow);
      mesh.position.set(Math.cos(pr.ang) * pr.rad, 0, Math.sin(pr.ang) * pr.rad);
    } else {
      mesh = new THREE.Group();
      const top = new THREE.Mesh(new THREE.CylinderGeometry(.9 * pr.s, .9 * pr.s, .12, 16), propMat);
      top.position.y = .8;
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(.12, .16, .8, 8), propMatDim);
      leg.position.y = .4;
      mesh.add(top, leg);
      mesh.position.set(Math.cos(pr.ang) * pr.rad, 0, Math.sin(pr.ang) * pr.rad);
    }
    scene.add(mesh);
  }
  sun.color.offsetHSL(SCENE.hueShift, 0, 0);

  /* NPC 实例 */
  const palette = [0x7eb8ff, 0xffb37e, 0x9f8fff, 0x7effc3, 0xff8fb3, 0xffe37e];
  const npcs = [];
  const loader = new GLTFLoader();
  const gltf = await loader.loadAsync(GLB_URL);
  AGENTS.forEach((a, i) => {
    const root = gltf.scene.clone(true);
    root.traverse(o => { if (o.isMesh) { o.material = o.material.clone(); o.material.color.multiplyScalar(1); } });
    const angle = (i / Math.max(AGENTS.length, 1)) * Math.PI * 2 + SCENE.angleOffset;
    const radius = 4.6 + (i % 3) * 0.45;
    root.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
    root.lookAt(0, 0, 0);
    root.userData = { index: i };
    scene.add(root);
    // 头顶名牌
    const cv = document.createElement("canvas"); cv.width = 256; cv.height = 72;
    const cx = cv.getContext("2d");
    cx.fillStyle = "rgba(13,16,23,.85)"; roundRect(cx, 4, 6, 248, 56, 14); cx.fill();
    cx.fillStyle = "#" + palette[i % palette.length].toString(16).padStart(6, "0");
    cx.font = "bold 30px sans-serif"; cx.textAlign = "center";
    cx.fillText(a.name, 128, 46);
    const tex = new THREE.CanvasTexture(cv);
    const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
    label.scale.set(2.2, 0.62, 1); label.position.set(root.position.x, 3.1, root.position.z);
    scene.add(label);
    let mixer = null;
    try {
      mixer = new THREE.AnimationMixer(root);
      const idle = gltf.animations.find(a => /idle/i.test(a.name)) || gltf.animations[0];
      if (idle) mixer.clipAction(idle).play();
    } catch (e) {}
    npcs.push({ agent: a, root, label, mixer, color: palette[i % palette.length],
      basePos: root.position.clone(), wPhase: i * 1.7 });
  });

  function roundRect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  /* 选择 */
  const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
  let selected = 0;
  renderer.domElement.addEventListener("click", e => {
    const r = renderer.domElement.getBoundingClientRect();
    ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ptr, camera);
    const hits = ray.intersectObjects(npcs.map(n => n.root), true);
    if (hits.length) {
      let o = hits[0].object;
      while (o && o.userData.index === undefined) o = o.parent;
      if (o) select(o.userData.index);
    }
  });
  function select(i) {
    selected = i;
    npcs.forEach((n, j) => n.label.material.opacity = j === i ? 1 : 0.45);
    sys(`${npcs[i].agent.name}（${npcs[i].agent.role}）注意到了你`);
    renderNpcList();
    refreshBuyBtn();
  }

  /* 对话 */
  const log = document.getElementById("chat-log");
  const say = document.getElementById("say");
  function bubble(role, html) {
    const d = document.createElement("div");
    d.className = "msg " + role; d.innerHTML = html;
    log.appendChild(d);
    while (log.children.length > 60) log.removeChild(log.firstChild);
    log.scrollTop = log.scrollHeight;
    return d;
  }
  const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function sys(text) { bubble("sys", text); }
  function npcLine(i, text) { bubble("npc", `<b>${esc(AGENTS[i].name)}</b><br>${esc(text)}`); }

  function systemPrompt(i) {
    const a = AGENTS[i];
    const beat = STORY.beats[storyIdx] || {};
    return `你在一场名为「${GAME.name}」的游戏原型里扮演 NPC。
角色：${a.name}（${a.role}），人设：${a.persona}，当前情绪基调：${a.mood}。
世界观前提：${STORY.premise}
当前剧情：第${day}天 · ${beat.phase || ""}「${beat.title || ""}」——${beat.desc || ""}
玩法基调：${GAME.tagline}（${GAME.difficulty}）
要求：始终以 ${a.name} 的身份第一人称说话，2~4 句，符合人设与情绪，可以推进当前剧情但不要跳出世界观。`;
  }

  async function send() {
    const text = say.value.trim(); if (!text) return;
    say.value = ""; bubble("me", esc(text));
    const i = selected;
    if (!providerReady) return ruleReply(i, text);
    const t = bubble("thinking", "……");
    try {
      const a = AGENTS[i];
      // 近期对话（本页内存）+ 长期记忆（引擎 MemoryStore 检索）
      const recent = (histMap.get(a.name) || []).slice(-6);
      const recalled = mem.retrieve(a.name, "玩家", text, day, 3)
        .map(e => `· ${e.text}`);
      const memLine = recalled.length ? `\n[${a.name}对玩家的长期记忆]\n${recalled.join("\n")}` : "";
      const msgs = [
        { role: "system", content: systemPrompt(i) + memLine },
        ...recent,
        { role: "user", content: text }
      ];
      const out = await provider.complete(msgs, { max: 300 });
      t.remove(); npcLine(i, out);
      track("talk");
      const h = histMap.get(a.name) || [];
      h.push({ role: "user", content: text }, { role: "assistant", content: out });
      histMap.set(a.name, h.slice(-12));
      mem.record(a.name, { text: `玩家说：${text}`, about: "玩家", imp: 2, turn: day });
      mem.record(a.name, { text: `我回答：${out.slice(0, 120)}`, about: "玩家", imp: 1, turn: day });
    } catch (e) {
      t.remove(); sys(`（模型调用失败：${esc(String(e.message || e))}，已用性格引擎回复）`);
      ruleReply(i, text);
    }
  }
  const histMap = new Map();
  document.getElementById("send").onclick = send;
  say.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

  function ruleReply(i, text) {
    track("talk");
    const a = AGENTS[i];
    const openers = ["（歪头打量你）", "（放下手里的东西）", "（压低声音）", ""];
    const o = openers[Math.floor(Math.random() * openers.length)];
    const about = (text || "").slice(0, 24);
    npcLine(i, `${o}${about ? "关于「" + about + "」……" : ""}（${a.mood}地）${a.persona.split("，")[0]}。${storyIdx < STORY.beats.length ? "眼下这事，你问倒我了——「" + STORY.beats[storyIdx].title + "」之后再说吧。" : ""}`);
  }

  /* 剧情 */
  let storyIdx = JSON.parse(localStorage.getItem("game." + GAME.id + ".beat") || "0");
  let day = JSON.parse(localStorage.getItem("game." + GAME.id + ".day") || "1");
  function renderStory() {
    const el = document.getElementById("page-story");
    let html = `<p class="hint" style="margin-bottom:10px">${esc(STORY.premise)}</p>`;
    STORY.beats.forEach((b, i) => {
      const cls = i === storyIdx ? "now" : (i < storyIdx ? "done" : "");
      html += `<div class="beat ${cls}"><div class="ph">${esc(b.phase)}${i < storyIdx ? " · 已完成" : i === storyIdx ? " · 进行中" : ""}</div><div class="tt">${esc(b.title)}</div><div class="ds">${esc(b.desc)}</div></div>`;
    });
    const cur = STORY.beats[storyIdx] || {};
    const chs = (cur.choices || []).filter(c => c && c.label);
    if (storyIdx >= STORY.beats.length) {
      html += `<button disabled>故事已抵达结局</button>`;
    } else if (chs.length) {
      html += `<div class="choices">` + chs.map((c, ci) => {
        const eff = parseEffect(c.effect);
        const blocked = !!(eff && eff.d < 0 && resAmount(eff.res) < -eff.d);
        return `<button class="choice ${blocked ? "off" : ""}" data-ci="${ci}" ${blocked ? "disabled" : ""}
          title="${blocked ? esc(eff.res) + " 不足" : "前往第 " + (nextOf(c) + 1) + " 拍"}">${esc(c.label)}${eff ? `<i>${esc((eff.d > 0 ? "＋" : "－") + Math.abs(eff.d) + " " + eff.res)}</i>` : ""}</button>`;
      }).join("") + `</div>`;
    } else {
      html += `<button id="btn-next">推进剧情 → 第 ${storyIdx + 1} 拍</button>`;
    }
    el.innerHTML = html;
    const btn = document.getElementById("btn-next");
    if (btn) btn.onclick = () => advanceTo(storyIdx + 1, null);
    el.querySelectorAll(".choice").forEach(b2 => b2.onclick = () => {
      const c = chs[+b2.dataset.ci];
      advanceTo(nextOf(c), c.effect);
    });
  }
  /* 分支数据模型:c.next = 目标拍序号(0 起);省略/-1 = 顺延;effect = "资源±数量" */
  function parseEffect(s) {
    if (!s) return null;
    const m = String(s).trim().match(/^(.+?)([+\-＋－])(\d+)$/);
    return m ? { res: m[1].trim(), d: (m[2] === "+" || m[2] === "＋" ? 1 : -1) * (+m[3]) } : null;
  }
  function nextOf(c) {
    const n = c && c.next;
    return (n === null || n === undefined || n < 0) ? storyIdx + 1 : Math.min(Math.max(0, n), STORY.beats.length);
  }
  async function advanceTo(target, effectStr) {
    if (storyIdx >= STORY.beats.length) return;
    const b = STORY.beats[storyIdx];
    const eff = parseEffect(effectStr);
    if (eff) {
      if (eff.d < 0 && resAmount(eff.res) < -eff.d) { sys(`${eff.res}不足（需要 ${-eff.d}）`); renderStory(); return; }
      resAdd(eff.res, eff.d, "分支选择");
    }
    sys(`📖 第 ${day} 天 · 剧情推进：「${b.title}」`);
    if (providerReady) {
      const t = bubble("thinking", "导演系统正在运镜……");
      try {
        const out = await provider.complete([
          { role: "system", content: "你是游戏导演系统（DirectorSystem），用 2~3 句有画面感的中文旁白演绎当前剧情节拍，不要解释。" },
          { role: "user", content: `前提：${STORY.premise}\n节拍：${b.phase}「${b.title}」——${b.desc}\n玩家已进行到第${day}天。` }
        ], { max: 200 });
        t.remove(); bubble("npc", `<b>🎬 导演</b><br>${esc(out)}`);
      } catch (e) { t.remove(); }
    } else {
      bubble("npc", `<b>🎬 导演</b><br>${esc(b.desc)}`);
    }
    storyIdx = target; day++;
    track("advance");
    resAdd(RES[0], 15, "剧情推进奖励");
    localStorage.setItem("game." + GAME.id + ".beat", JSON.stringify(storyIdx));
    localStorage.setItem("game." + GAME.id + ".day", JSON.stringify(day));
    document.getElementById("day").textContent = day;
    renderStory(); renderCodex();
  }

  /* ---- 经济账本（v0.3 真逻辑）：玩法模板的资源就是真实数值 ---- */
  const RES_NAMES = ((GAME.economy || []).map(r => (r && r.name) ? r.name : String(r)).filter(Boolean));
  const RES = RES_NAMES.length ? RES_NAMES : ["金币"];
  const RES_KEY = "game." + GAME.id + ".res";
  let resBag = JSON.parse(localStorage.getItem(RES_KEY) || "{}");
  if (!(RES[0] in resBag)) { // 旧存档的「金币」迁移为模板主资源
    const legacy = +(localStorage.getItem("game." + GAME.id + ".coins") || 0);
    if (legacy) resBag[RES[0]] = legacy;
  }
  function resAmount(n) { return resBag[n] | 0; }
  function resAdd(n, d, why) {
    resBag[n] = Math.max(0, (resBag[n] | 0) + d);
    localStorage.setItem(RES_KEY, JSON.stringify(resBag));
    renderRes();
    if (why) sys(`${d > 0 ? "＋" : "－"}${Math.abs(d)} ${n}（${why}）`);
  }
  function renderRes() {
    const el = document.getElementById("res-chips");
    if (el) el.innerHTML = RES.slice(0, 4).map(n =>
      `<span class="chip">${esc(n)} <b style="color:#ffd88a">${resAmount(n)}</b></span>`).join("");
  }
  function earn(n, why) { resAdd(RES[0], n, why); }

  const buyBtn = document.getElementById("buy-hint");
  function refreshBuyBtn() {
    const a = AGENTS[selected];
    const can = /商人|向导|情报|守灯|收藏|医师|医生|祭司/.test(a?.role || "") || /商|贩|情报|向导/.test(a?.name || "");
    buyBtn.style.display = can ? "" : "none";
  }
  buyBtn.onclick = async () => {
    if (resAmount(RES[0]) < 10) { sys(`${RES[0]}不够（现有 ${resAmount(RES[0])}，需要 10）——推进剧情可获得更多`); return; }
    const i = selected, a = AGENTS[i];
    resAdd(RES[0], -10, "购买线索");
    track("buy");
    const beat = STORY.beats[Math.min(storyIdx, STORY.beats.length - 1)] || {};
    if (providerReady) {
      const t = bubble("thinking", "（TA 环顾四周，压低声音……）");
      try {
        const out = await provider.complete([
          { role: "system", content: `你是${a.name}（${a.role}），玩家刚花10金币向你买了一条剧情线索。按你的人设，用1~2句悄悄透露关于当前剧情「${beat.title || "?"}」的真实有用信息。` },
          { role: "user", content: "这是金币。说吧，你知道什么？" }
        ], { max: 120 });
        t.remove(); npcLine(i, out);
      } catch (e) { t.remove(); sys("（交易被打断了……）"); }
    } else {
      npcLine(i, `（收下金币，压低声音）关于「${beat.title || "眼下的局面"}」——${beat.desc || "风声很紧，自己当心。"}`);
    }
  };

  /* ---- 存档导出/导入（v0.2）：打包本游戏全部 localStorage ---- */
  function exportSave() {
    const data = {};
    for (let k = 0; k < localStorage.length; k++) {
      const key = localStorage.key(k);
      if (key && key.startsWith("game." + GAME.id + ".")) data[key] = localStorage.getItem(key);
    }
    const blob = new Blob([JSON.stringify({ game: GAME.id, saved_at: Date.now(), data }, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `oriera-存档-${GAME.id}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }
  function importSave(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result);
        Object.entries(j.data || {}).forEach(([k, v]) => localStorage.setItem(k, v));
        location.reload();
      } catch (e) { sys("存档文件无法识别"); }
    };
    r.readAsText(file);
  }

  /* 玩法图鉴（v0.3 真逻辑）：核心循环按玩家真实行为自动追踪 */
  const doneManual = new Set(JSON.parse(localStorage.getItem("game." + GAME.id + ".loop") || "[]"));
  const doneAuto = new Set(JSON.parse(localStorage.getItem("game." + GAME.id + ".loopAuto") || "[]"));
  const stepDone = i => doneManual.has(i) || doneAuto.has(i);
  /* 行为→步骤归类：对话类/交易类靠关键词，其余随剧情推进 */
  function stepKind(s) {
    if (/对话|社交|询问|聊天|交流|谈判|打听/.test(s)) return "talk";
    if (/交易|购买|经济|商店|花钱|买/.test(s)) return "buy";
    return "advance";
  }
  function track(kind) {
    let hit = false;
    GAME.core_loop.forEach((s, i) => {
      if (stepDone(i) || stepKind(s) !== kind) return;
      doneAuto.add(i); hit = true;
    });
    if (!hit) return;
    localStorage.setItem("game." + GAME.id + ".loopAuto", JSON.stringify([...doneAuto]));
    renderCodex();
    sys("🎯 核心循环推进（按真实行为自动点亮）");
  }
  function renderCodex() {
    let html = "<h4>核心循环 <span style='font-size:11px;color:#6fd3a0'>按你的真实行为自动追踪</span></h4>";
    GAME.core_loop.forEach((s, i) => {
      const auto = doneAuto.has(i) && !doneManual.has(i);
      html += `<div class="loop-step ${stepDone(i) ? "done" : ""}" data-i="${i}"><span>${stepDone(i) ? "✅" : "▫️"}</span>${esc(s)}${auto ? "<span class='loop-auto'>自动</span>" : ""}</div>`;
    });
    html += "<h4>机制系统</h4>";
    GAME.mechanics.forEach(m => { html += `<div class="mech"><b>${esc(m.name)}</b><div>${esc(m.detail)}</div></div>`; });
    html += "<h4>经济循环</h4><table class=\"eco\"><tr><th>资源</th><th>来源</th><th>去向</th></tr>";
    GAME.economy.forEach(r => { html += `<tr><td>${esc(r.name)}</td><td>${esc(r.source)}</td><td>${esc(r.sink)}</td></tr>`; });
    html += `</table><h4>难度曲线</h4><div class="mech"><div>${esc(GAME.difficulty)}</div></div>`;
    html += `<h4>LLM 预算账本</h4><div class="mech"><div>本局模型调用 <b>${ledger.calls}</b> 次 · 失败 ${ledger.fails} 次。导演自主发言走队列：间隔抖动 + 失败退避，防请求风暴。</div></div>`;
    html += `<h4>存档</h4><div style="display:flex;gap:8px;flex-wrap:wrap">
      <button id="btn-export-save" style="background:#2d5b9e;color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px">📤 导出存档</button>
      <button id="btn-import-save" style="background:#161a28;color:#cdd6ec;border:1px solid #2a3a5c;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12.5px">📥 导入存档</button>
      <input type="file" id="save-file" accept="application/json" style="display:none" />
    </div>
    <p style="color:#5f6b8a;font-size:11px;margin:8px 0 0">金币与记忆都在浏览器里——换电脑前记得导出。</p>`;
    const el = document.getElementById("page-codex");
    el.innerHTML = html;
    el.querySelector("#btn-export-save").onclick = exportSave;
    el.querySelector("#btn-import-save").onclick = () => el.querySelector("#save-file").click();
    el.querySelector("#save-file").onchange = e => { if (e.target.files[0]) importSave(e.target.files[0]); };
    el.querySelectorAll(".loop-step").forEach(d => d.onclick = () => {
      const i = +d.dataset.i;
      doneManual.has(i) ? doneManual.delete(i) : doneManual.add(i);
      localStorage.setItem("game." + GAME.id + ".loop", JSON.stringify([...doneManual]));
      renderCodex();
    });
  }

  /* 居民列表 */
  function renderNpcList() {
    const el = document.getElementById("page-npcs");
    el.innerHTML = AGENTS.map((a, i) => `
      <div class="npc-row ${i === selected ? "sel" : ""}" data-i="${i}">
        <div class="npc-ava" style="background:#${npcs[i].color.toString(16).padStart(6,"0")}22;border:2px solid #${npcs[i].color.toString(16).padStart(6,"0")}"></div>
        <div><div class="npc-nm">${esc(a.name)} <span class="npc-rl">· ${esc(a.role)}</span></div>
        <div class="npc-pf">${esc(a.persona)}</div></div>
      </div>`).join("");
    el.querySelectorAll(".npc-row").forEach(d => d.onclick = () => select(+d.dataset.i));
  }

  /* Tabs */
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
    document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll(".tab-page").forEach(p => p.classList.remove("on"));
    document.getElementById("page-" + b.dataset.t).classList.add("on");
  });

  /* 开场 */
  document.getElementById("tagline").textContent = GAME.tagline;
  document.getElementById("day").textContent = day;
  renderRes();
  renderStory(); renderCodex(); renderNpcList(); select(0);
  npcs[0] && sys(`欢迎来到「${esc(GAME.name)}」。${esc(AGENTS[0].name)}正在看你——去和 TA 说说第一句话吧。`);
  // NPC 开场白（顺序错开）
  AGENTS.forEach((a, i) => setTimeout(() => {
    if (i === selected) npcLine(i, a.first_line);
    else sys(`${a.name}（${a.role}）：「${a.first_line}」`);
  }, 600 + i * 2600));

  /* ---- 导演队列（P3 契约：一切经队列、一切有预算）----
     不再是裸 setInterval 直调 LLM：间隔抖动 + 失败指数退避（防 429 风暴）+ 调用计量落盘。
     预算账本在「玩法」面板可见。 */
  const LLM_LEDGER_KEY = "game." + GAME.id + ".llmledger";
  const ledger = (() => {
    try { return JSON.parse(localStorage.getItem(LLM_LEDGER_KEY)) || { calls: 0, fails: 0 }; }
    catch { return { calls: 0, fails: 0 }; }
  })();
  function saveLedger() { localStorage.setItem(LLM_LEDGER_KEY, JSON.stringify(ledger)); }
  function bill(ok) { ledger.calls++; if (!ok) ledger.fails++; saveLedger(); }

  let directorBackoff = 1;
  const DIRECTOR_BASE = 45000;
  function directorTick() {
    const jitter = 0.8 + Math.random() * 0.4; // ±20% 抖动，避免节拍式请求
    setTimeout(async () => {
      if (providerReady && !document.hidden) {
        const i = Math.floor(Math.random() * AGENTS.length);
        try {
          // 注意：messages 不能只有 system——智谱/DeepSeek 等端点会直接 400
          const out = await provider.complete([
            { role: "system", content: systemPrompt(i) + "\n现在你没有被对话，请自然地自言自语或对世界发表一句感慨，1~2 句。" },
            { role: "user", content: "（此刻你在做什么？自然地说一句话）" }
          ], { max: 90 });
          bill(true);
          directorBackoff = 1;
          if (i === selected) npcLine(i, out); else sys(`${AGENTS[i].name}：「${out}」`);
        } catch (e) {
          bill(false);
          directorBackoff = Math.min(directorBackoff * 2, 7); // 失败翻倍退避，封顶约 5 分钟
        }
      }
      directorTick();
    }, DIRECTOR_BASE * directorBackoff * jitter);
  }
  directorTick();

  /* 主循环 */
  const clock = new THREE.Clock();
  (function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    npcs.forEach((n, j) => {
      n.label.position.y = 3.1 + Math.sin(clock.elapsedTime * 2 + j) * 0.06;
      if (n.mixer) n.mixer.update(dt);
      if (j === selected) n.root.rotation.y += 0.004;
      // 按包种子节奏的原地游走（不改变 NPC 与玩家的相对站圈）
      const t2 = clock.elapsedTime * SCENE.wanderSpeed + n.wPhase;
      n.root.position.x = n.basePos.x + Math.sin(t2) * SCENE.wanderAmp;
      n.root.position.z = n.basePos.z + Math.cos(t2 * 0.8) * SCENE.wanderAmp;
    });
    controls.update();
    renderer.render(scene, camera);
  })();
  window.addEventListener("resize", () => {
    camera.aspect = sceneEl.clientWidth / sceneEl.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(sceneEl.clientWidth, sceneEl.clientHeight);
  });
}
boot();
</script>
</body>
</html>
