<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>互动影游</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --ink: #dce8f2; --dim: #93a7b4; --accent: #ff9a3c; --bg: #060b10; }
  html, body { height: 100%; background: #02050a; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); }
  #stage { position: relative; max-width: 480px; height: 100dvh; margin: 0 auto; overflow: hidden; background: var(--bg); }
  /* ── CSS 氛围兜底层（无视频时的雨夜） ── */
  #ambience { position: absolute; inset: 0; transition: background 1.2s; background:
    radial-gradient(ellipse at 50% 30%, #16303f 0%, #0a141c 55%, #04080c 100%); }
  #ambience.cab { background: radial-gradient(ellipse at 50% 35%, #3a2c14 0%, #161009 60%, #060402 100%); }
  #ambience.night { background: radial-gradient(ellipse at 50% 30%, #26142a 0%, #0d0710 60%, #030207 100%); }
  .rain { position: absolute; top: -60px; width: 1px; height: 46px; opacity: .3;
    background: linear-gradient(transparent, #9fc8e8); animation: fall linear infinite; }
  @keyframes fall { to { transform: translateY(112vh); } }
  #ambience::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.14) 3px 4px); }
  /* ── 真视频层 ── */
  #vid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    background: #000; display: none; z-index: 2; }
  #vid.on { display: block; }
  #vid.frozen { filter: brightness(.8) saturate(.94); }
  /* ── 字幕 ── */
  #subwrap { position: absolute; left: 0; right: 0; bottom: 24%; z-index: 3; padding: 0 7%;
    text-align: center; pointer-events: none; }
  #scene-title { position: absolute; top: 7%; width: 100%; text-align: center; z-index: 3;
    font-size: 13px; letter-spacing: .5em; text-indent: .5em; color: var(--dim); opacity: 0; transition: opacity 1s; }
  #scene-title.show { opacity: .92; }
  #sub { font-size: 17px; line-height: 1.9; text-shadow: 0 1px 6px #000; min-height: 3.8em; }
  #speaker { display: block; font-size: 12px; letter-spacing: .3em; color: var(--accent); margin-bottom: 6px; }
  /* ── 交互 ── */
  #go { position: absolute; right: 7%; bottom: 17%; z-index: 4; display: none;
    padding: 8px 22px; background: rgba(10,18,26,.9); border: 1px solid rgba(255,154,60,.5);
    border-radius: 999px; font-size: 14px; color: var(--accent); letter-spacing: .2em; cursor: pointer; }
  #choices { position: absolute; left: 0; right: 0; bottom: 6%; z-index: 4; display: none;
    flex-direction: column; gap: 10px; padding: 0 8%; }
  .opt { padding: 12px 18px; background: rgba(10,20,30,.88); border: 1px solid rgba(220,232,242,.22);
    border-radius: 12px; color: var(--ink); font-size: 14.5px; text-align: left; cursor: pointer;
    font-family: inherit; transition: all .18s; }
  .opt:hover { border-color: var(--accent); color: var(--accent); }
  #timer-ring { position: absolute; left: 50%; bottom: 20.5%; transform: translateX(-50%);
    width: 44px; height: 44px; z-index: 4; display: none; }
  #timer-ring svg circle { fill: none; stroke-width: 3; }
  #toast { position: absolute; top: 12%; left: 50%; transform: translateX(-50%) translateY(8px); z-index: 5;
    padding: 8px 22px; background: rgba(10,18,26,.9); border: 1px solid rgba(255,154,60,.5);
    border-radius: 999px; font-size: 14px; color: var(--accent); letter-spacing: .2em;
    opacity: 0; pointer-events: none; transition: opacity .4s, transform .4s; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* ── 标题屏 / 结局屏 ── */
  .veil { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; text-align: center;
    background: radial-gradient(ellipse at 50% 38%, rgba(20,38,54,.92), rgba(4,8,12,.97) 75%);
    transition: opacity .9s; padding: 8%; }
  .veil.hide { opacity: 0; pointer-events: none; }
  .veil h1 { font-size: clamp(30px, 9vmin, 46px); letter-spacing: .42em; text-indent: .42em; font-weight: 400; }
  .veil .sub { color: var(--dim); letter-spacing: .3em; font-size: 13px; line-height: 2; }
  .veil .btn { padding: 13px 42px; border: 1px solid rgba(255,255,255,.3); border-radius: 999px;
    background: transparent; color: var(--ink); font-size: 15px; letter-spacing: .35em; text-indent: .35em;
    cursor: pointer; font-family: inherit; transition: all .2s; }
  .veil .btn:hover { border-color: var(--accent); color: var(--accent); }
  .veil .btn[disabled] { opacity: .35; cursor: not-allowed; }
  #ending-veil .dex { color: var(--dim); font-size: 12.5px; line-height: 2; letter-spacing: .12em; }
  #hud { position: absolute; top: 2.6%; left: 5%; right: 5%; display: flex; gap: 10px; z-index: 3;
    font-size: 11px; color: rgba(147,167,180,.75); letter-spacing: .18em; }
  #hud .chip { border: 1px solid rgba(147,167,180,.28); border-radius: 999px; padding: 3px 10px; }
  #mute-tip { position: absolute; top: 2.6%; right: 5%; z-index: 4; font-size: 11px; color: var(--dim);
    letter-spacing: .2em; display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="ambience"></div>
  <video id="vid" playsinline muted></video>
  <div id="scene-title"></div>
  <div id="subwrap"><span id="speaker"></span><span id="sub"></span></div>
  <div id="hud"></div>
  <div id="mute-tip">🔇 被静音 · 点按画面开声</div>
  <div id="toast"></div>
  <svg id="timer-ring" viewBox="0 0 44 44">
    <circle cx="22" cy="22" r="19" stroke="rgba(255,255,255,.15)"></circle>
    <circle id="ring-fg" cx="22" cy="22" r="19" stroke="#ff9a3c" stroke-linecap="round"
      stroke-dasharray="119.4" stroke-dashoffset="0" transform="rotate(-90 22 22)"></circle>
  </svg>

  <button id="go">▸ 继续</button>
  <div id="choices"></div>

  <div class="veil" id="title-veil">
    <h1 id="game-title">互动影游</h1>
    <div class="sub" id="game-sub"></div>
    <button class="btn" id="btn-new">新开局</button>
    <button class="btn" id="btn-continue" disabled>继 续</button>
    <div class="sub" style="margin-top:4vh; opacity:.55">OriEra Studio · 影游工作流导出</div>
  </div>

  <div class="veil hide" id="ending-veil">
    <div class="sub" style="color:var(--accent); letter-spacing:.5em">· 结 局 ·</div>
    <h1 id="end-title"></h1>
    <div class="sub" id="end-text" style="max-width:34ch; line-height:2"></div>
    <div class="dex" id="end-dex"></div>
    <button class="btn" id="btn-again">再玩一次</button>
  </div>
</div>

<script>
"use strict";
/* ═══ 注入点：下方三行占位（导出时由 Studio 替换为 JSON 字面量） ═══ */
const STORY = "__STORY__";
const STORY_CLIPS = "__CLIPS__";
const STORY_VOS = "__VOS__";
const SAVE_KEY = "film.save.v1";

const $ = id => document.getElementById(id);
const nodes = Object.fromEntries(STORY.nodes.map(n => [n.id, n]));
let vars = { ...STORY.vars };
let nodeId = STORY.nodes[0].id;
let voAudio = null, typeTimer = null, countdown = null;

$("game-title").textContent = STORY.meta?.title || "互动影游";
$("game-sub").textContent = STORY.meta?.subtitle || "";
const m = location.search.match(/[?&]reset=1/);
if (m) localStorage.removeItem(SAVE_KEY);
const sv = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
if (sv) { $("btn-continue").disabled = false; }

/* ── CSS 氛围兜底：node.mood → 色调 + 雨丝 ── */
(function ambience() {
  const amb = $("ambience");
  const n = 60;
  for (let i = 0; i < n; i++) {
    const r = document.createElement("i");
    r.className = "rain";
    r.style.left = (Math.random() * 100) + "%";
    r.style.animationDuration = (0.55 + Math.random() * 0.7) + "s";
    r.style.animationDelay = (-Math.random() * 1.2) + "s";
    r.style.opacity = 0.12 + Math.random() * 0.3;
    amb.appendChild(r);
  }
})();

function setMood(node) {
  const amb = $("ambience");
  amb.classList.remove("cab", "night");
  if (node.mood === "cab" || /车厢|车|暖/.test(node.scene || "")) amb.classList.add("cab");
  if (node.mood === "night" || /夜|雨/.test(node.scene || "")) { /* 默认青蓝 */ }
}

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}
function applySets(sets) {
  if (!sets) return;
  for (const [k, v] of Object.entries(sets)) {
    const s = String(v), d = parseFloat(s);
    if (s.startsWith("+")) vars[k] = (vars[k] || 0) + d;
    else if (s.startsWith("-")) vars[k] = (vars[k] || 0) - d;
    else if (Number.isFinite(d) && /^\d/.test(s)) vars[k] = d;
    else vars[k] = s;
  }
  localStorage.setItem(SAVE_KEY, JSON.stringify({ nodeId, vars }));
}
function evalCond(when) {
  if (!when) return true;
  const m = when.match(/^(\w+)\s*(>=|<=|>|<|==|!=)\s*(-?\d+)$/);
  if (!m) return true;
  const a = vars[m[1]] || 0, b = parseInt(m[3]);
  return { ">=": a >= b, "<=": a <= b, ">": a > b, "<": a < b, "==": a === b, "!=": a !== b }[m[2]];
}
function renderText(t) {
  return String(t).replace(/\{(\w+)\s*\?\s*'([^']*)'\s*:\s*'([^']*)'\}/g,
    (_, c, y, n) => (vars[c] ? y : n));
}
function typeText(el, text, done) {
  clearInterval(typeTimer);
  el.textContent = "";
  let i = 0;
  typeTimer = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) { clearInterval(typeTimer); done && done(); }
  }, 34);
}

/* ── 真视频层（素材缺失 → CSS 氛围兜底） ── */
function playClip(key, onEnd) {
  const v = $("vid");
  const src = STORY_CLIPS[key];
  if (!src) { v.classList.remove("on", "frozen"); setTimeout(onEnd, 400); return; }
  v.src = src; v.classList.add("on"); v.classList.remove("frozen");
  v.currentTime = 0;
  v.onended = () => { v.classList.add("frozen"); onEnd(); };
  v.play().catch(() => v.play().catch(() => setTimeout(onEnd, 800)));
}
function playVo(key) {
  window.__lastVo = key;
  const src = STORY_VOS[key];
  if (!src) return;
  if (voAudio) { voAudio.pause(); }
  voAudio = new Audio(src);
  voAudio.play().catch(() => {});
}

function enterNode(id) {
  const node = nodes[id];
  if (!node) return endGame(nodes[STORY.nodes[STORY.nodes.length - 1].id]);
  nodeId = id;
  localStorage.setItem(SAVE_KEY, JSON.stringify({ nodeId, vars }));
  setMood(node);
  const st = $("scene-title");
  st.textContent = node.title || ""; st.classList.add("show");
  setTimeout(() => st.classList.remove("show"), 2400);

  if (node.type === "ending") return setTimeout(() => endGame(node), 350);

  const shots = node.shots || [];
  // 顺序：逐镜头播视频（vo 并行叠加），全部结束后进交互
  const runShots = (i) => {
    if (i >= shots.length) return afterShots(node);
    const key = `${node.id}_${i}`;
    const shot = shots[i];
    if (shot.vo) {
      const vm = String(shot.vo).match(/^(\w+)\s*[:：]\s*(.+)$/);
      if (vm) { $("speaker").textContent = ({ narrator: "——", lin: "林晚", umbrella: "黑伞男" }[vm[1]] || vm[1]); typeText($("sub"), vm[2]); }
      else typeText($("sub"), String(shot.vo));
      playVo(key);
    } else if (node.text && i === 0) {
      typeText($("sub"), renderText(node.text).slice(0, 120));
    }
    playClip(key, () => setTimeout(() => runShots(i + 1), 200));
  };
  runShots(0);
  // 无镜头的节点直接展示文本
  if (!shots.length) {
    typeText($("sub"), renderText(node.text || ""));
    setTimeout(() => afterShots(node), Math.min(2600, 900 * (node.text || "").length / 22 + 1200));
  }
}

function afterShots(node) {
  if (node.goto) return enterNode(node.goto);
  if (node.routes) {  // hub：first-true-else-default
    for (const r of node.routes) if (evalCond(r.when)) return enterNode(r.goto);
    return enterNode(node.routes[node.routes.length - 1].goto);
  }
  // choice：选项 + 倒计时（超时走 timeout 项）
  const box = $("choices");
  box.innerHTML = "";
  (node.options || []).forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = renderText(opt.text);
    b.onclick = () => { stopCountdown(); applySets(opt.set); box.style.display = "none"; enterNode(opt.goto); };
    box.appendChild(b);
  });
  box.style.display = "flex";
  startCountdown(node.timeout || 0, () => {
    const to = (node.options || []).find(o => o.timeout) || node.options[node.options.length - 1];
    if (to) { applySets(to.set); box.style.display = "none"; enterNode(to.goto); }
  });
}

function startCountdown(sec, onTimeout) {
  stopCountdown();
  if (!sec) return;
  const ring = $("timer-ring"), fg = $("ring-fg");
  const total = sec;
  let left = sec;
  ring.style.display = "block";
  fg.style.strokeDashoffset = 0;
  countdown = setInterval(() => {
    left--;
    fg.style.strokeDashoffset = 119.4 * (1 - left / total);
    if (left <= 0) { stopCountdown(); onTimeout(); }
  }, 1000);
}
function stopCountdown() {
  clearInterval(countdown);
  $("timer-ring").style.display = "none";
  $("choices").style.display = "none";
}

function endGame(node) {
  stopCountdown();
  const v = $("vid");
  if (STORY_CLIPS[`${node.id}_0`]) {
    v.src = STORY_CLIPS[`${node.id}_0`]; v.classList.add("on"); v.classList.remove("frozen");
    v.play().catch(() => {});
  } else { v.classList.remove("on"); }
  playVo(`${node.id}_0`);
  $("end-title").textContent = node.title || "结局";
  $("end-text").textContent = renderText(node.text || "");
  const all = STORY.nodes.filter(n => n.type === "ending");
  const seen = JSON.parse(localStorage.getItem("film.dex.v1") || "{}");
  seen[node.id] = (seen[node.id] || 0) + 1;
  localStorage.setItem("film.dex.v1", JSON.stringify(seen));
  $("end-dex").innerHTML = `结局图鉴 ${Object.keys(seen).length}/${all.length}<br>` +
    all.map(e => `${seen[e.id] ? "◉" : "○"} ${e.title}`).join("<br>");
  localStorage.removeItem(SAVE_KEY);
  $("ending-veil").classList.remove("hide");
}

/* ── 开局 ── */
$("btn-new").onclick = () => {
  vars = { ...STORY.vars };
  $("title-veil").classList.add("hide");
  enterNode(STORY.nodes[0].id);
};
$("btn-continue").onclick = () => {
  if (!sv) return;
  vars = { ...STORY.vars, ...sv.vars };
  $("title-veil").classList.add("hide");
  enterNode(sv.nodeId);
};
$("btn-again").onclick = () => {
  vars = { ...STORY.vars };
  $("ending-veil").classList.add("hide");
  enterNode(STORY.nodes[0].id);
};
$("go").onclick = () => { const n = nodes[nodeId]; if (n?.goto) enterNode(n.goto); };
document.addEventListener("click", function unmute(e) {
  const v = $("vid");
  if (!v.muted) return document.removeEventListener("click", unmute);
  v.muted = false; v.volume = 1;
  if (voAudio) voAudio.volume = 1;
  $("mute-tip").style.display = "none";
});
</script>
</body>
</html>
